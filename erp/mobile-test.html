if(page==='stock'){app.innerHTML=brand()+heading('재고현황',`<button class="iconbtn" id="historyShortcut" aria-label="입출고 내역">${icon('history')}</button>`)+`<main class="main" id="main"><div class="stocktools"><div class="search">${icon('search')}<input id="q" type="search" placeholder="품목·브랜드·LOT 검색" aria-label="재고 검색" value="${e(query)}"><button id="clearq" aria-label="검색 지우기">×</button></div><div class="segments" aria-label="창고">${['전체','냉동고','냉장고','상온'].map(z=>`<button data-zone="${z}" class="${zone===z?'on':''}">${z}</button>`).join('')}</div><div class="filterline"><span id="stockcount"></span><div><button id="sort" class="${sort==='expiry'?'active':''}">${sort==='expiry'?'기한순':'품목순'} ${icon('chev')}</button><button id="filter" class="${cat!=='전체'?'active':''}">${icon('filter')} ${e(cat==='전체'?'분류':cat)}</button></div></div></div><div class="stocklist" id="stockrows"></div></main>`+nav();drawStock();$('q').oninput=ev=>{query=ev.target.value;drawStock()};$('clearq').onclick=()=>{query='';$('q').value='';drawStock();$('q').focus()};$('sort').onclick=()=>{sort=sort==='name'?'expiry':'name';render()};$('filter').onclick=()=>sheet('품목 분류',['전체','원료육','완제품','부재료','부자재'].map(c=>`<button class="listrow" data-cat="${c}"><span class="grow">${c}</span>${cat===c?icon('check'):''}</button>`).join(''));$('historyShortcut').onclick=()=>go('history');return}

function groups(){return master.map(p=>{const ls=lots.filter(l=>l.pid===p.id&&l.qty>0&&(zone==='전체'||l.zone===zone)&&(cat==='전체'||p.cat===cat));const selected=match(query,p.name,p.cat,p.id)?ls:ls.filter(l=>match(query,p.name,p.cat,l.brand,l.origin,l.vendor,l.id,l.expiry));return {p,ls:selected,qty:selected.reduce((a,l)=>a+l.qty,0),expiry:selected.map(l=>l.expiry).filter(Boolean).sort()[0]||''}}).filter(g=>g.ls.length).sort((a,b)=>(sort==='expiry'?(a.expiry||'9999').localeCompare(b.expiry||'9999'):0)||a.p.name.localeCompare(b.p.name,'ko'))}
function drawStock(){const gs=groups();$('stockcount').textContent=gs.length+'개 품목'+(query?' · 검색 결과':'');$('stockrows').innerHTML=gs.map(g=>`<button class="stockrow" data-stock="${g.p.id}"><div style="min-width:0"><div class="name">${e(g.p.name)}</div><span class="meta">${e([...new Set(g.ls.map(l=>[l.brand,l.origin].filter(Boolean).join(' · ')).filter(Boolean))].join(' / ')||g.p.cat)} · LOT ${g.ls.length}</span></div><div class="qty">${n(g.qty)} <small>${g.p.unit}</small><span class="expiry ${g.expiry&&g.expiry<='2026-12-25'?'warn':''}">${g.expiry?'기한 '+g.expiry.slice(2).replaceAll('-','.'):''}</span></div>${icon('chev')}</button>`).join('')||'<p class="blank">조회되는 재고가 없습니다.</p>'}
function stockDetail(id){const g=groups().find(x=>x.p.id===id);if(!g)return;sheet(g.p.name,`<div class="detailtotal"><span>조회 재고 · LOT ${g.ls.length}건</span><b>${n(g.qty)} ${g.p.unit}</b></div><div class="lotlist">${g.ls.slice().sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')).map(l=>`<article class="lot"><div class="lothead"><strong>${e(l.zone)} · <span class="${l.expiry&&l.expiry<='2026-12-25'?'warn':''}">${e(l.expiry||'기한 없음')}</span></strong><b>${n(l.qty)} ${g.p.unit}</b></div><div class="lotmeta">${e([l.brand,l.origin,l.vendor].filter(Boolean).join(' · '))}</div><div class="lotmeta">LOT ${e(l.id)}</div><div class="lotactions"><button data-lotaction="out" data-id="${l.id}">출고</button>${g.p.cat==='원료육'?`<button data-lotaction="move" data-id="${l.id}">${l.zone==='냉동고'?'해동':'재냉동'}</button>`:''}</div></article>`).join('')}</div>`);}
function renderWork(){const t=page,d=drafts[t],title={in:'입고 입력',out:'출고 입력',move:'이동 입력'}[t],kind=t==='out'?`<div class="row"><label for="kind">출고구분</label><select id="kind"><option value="" disabled hidden ${!d.kind?'selected':''}>선택</option>${kinds.map(k=>`<option ${d.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>`:'',partner=t==='move'?'':`<div class="row"><span class="label">${t==='in'?'업체':({업체:'업체',개인:'성명',폐기:'폐기사유',택배:'수령인',기타:'출고내용',현장:'생산품목'}[d.kind]||'업체')}</span>${t==='in'||d.kind==='업체'?`<button class="choice" id="partner">${e(d.partner||'거래처 선택')} ›</button>`:`<input id="recipient" value="${e(d.partner)}" ${!d.kind?'disabled':''} placeholder="${d.kind?'입력':'출고구분 선택'}">`}</div>`;
$('app').innerHTML=brand()+heading(title,`<button class="textbtn" id="reset">초기화</button>`)+`<main class="main" id="main"><div class="work">${t==='move'?`<div class="segments">${['해동','재냉동','현장 출고'].map(m=>`<button data-mode="${m}" class="${d.mode===m?'on':''}">${m}</button>`).join('')}</div><div style="font-size:12px;color:var(--muted);margin:0 3px 9px">${d.mode==='해동'?'냉동고 → 냉장고':d.mode==='재냉동'?'냉장고 → 냉동고':'냉장고 → 생산현장'}</div>`:''}<div class="group"><div class="row"><label for="workdate">날짜</label><input id="workdate" type="date" value="${d.date}"></div>${kind}${partner}<div class="row"><label for="note">비고</label><input id="note" placeholder="선택 입력" value="${e(d.note)}"></div></div><div class="section"><h2>품목 ${d.lines.length}건</h2><span>미저장</span></div><div class="lines">${d.lines.map((l,i)=>`<button class="listrow" data-edit="${i}"><span class="grow"><strong>${e(product(l.pid).name)}</strong><small>${e([l.brand,l.zone,l.expiry].filter(Boolean).join(' · '))}</small>${l.lot?`<small>LOT ${e(l.lot)}</small>`:''}</span><span class="right">${n(l.qty)} ${product(l.pid).unit}${l.price?`<small>${n(l.qty*l.price)}원</small>`:''}</span>${icon('chev')}</button>`).join('')||'<div class="blank"><b>등록된 품목 없음</b>하단 + 품목을 눌러 시작하세요.</div>'}</div><div class="error" id="workerror" role="alert"></div></div></main><div class="workfoot"><div class="total"><b>${d.lines.length}개 품목 · ${e(totals(d.lines))}</b>${t==='move'?'이동 수량':(t==='in'||d.kind==='업체')?'합계 '+n(d.lines.reduce((a,l)=>a+l.qty*(l.price||0),0))+'원':'출고 수량'}</div><button class="secondary addfixed" id="add">${icon('plus')} 품목</button><button class="primary" id="save">저장</button></div>`+nav();$('workdate').onchange=ev=>d.date=ev.target.value;$('note').oninput=ev=>d.note=ev.target.value;if($('recipient'))$('recipient').oninput=ev=>d.partner=ev.target.value;if($('kind'))$('kind').onchange=ev=>{const k=ev.target.value;if(d.lines.length&&(k==='현장'||d.kind==='현장')&&d.lines.some(l=>l.zone!=='냉장고'||product(l.pid).cat!=='원료육')){ev.tar function totals(lines){const m={};for(const l of lines){const u=product(l.pid).unit;m[u]=(m[u]||0)+l.qty}return Object.entries(m).map(([u,q])=>n(q)+' '+u).join(' · ')||'0'}
function choosePartner(){sheet('거래처 선택',`<div class="search">${icon('search')}<input id="partnerq" placeholder="거래처명 검색" aria-label="거래처 검색"></div><div id="partners"></div>`);const names=['테스트 거래처 A','테스트 거래처 B','테스트 거래처 C'];const draw=()=>{$('partners').innerHTML=names.filter(x=>match($('partnerq').value,x)).map(x=>`<button class="listrow" data-partner="${e(x)}"><span class="grow">${e(x)}</span>${icon('chev')}</button>`).join('')};$('partnerq').oninput=draw;draw()}
function eligible(t,pid){const d=drafts[t];return lots.filter(l=>l.pid===pid&&l.qty>0&&(t!=='move'||l.zone===(d.mode==='해동'?'냉동고':'냉장고'))&&(t!=='out'||d.kind!=='현장'||l.zone==='냉장고'&&product(pid).cat==='원료육'))}
function chooseProduct(t){if(t==='out'&&!drafts.out.kind){notify('출고구분을 먼저 선택해 주세요.');$('kind').focus();return}sheet('품목 선택',`<div class="search">${icon('search')}<input id="productq" placeholder="품목명·브랜드 검색" aria-label="품목 검색"></div><div id="products"></div>`);const draw=()=>{$('products').innerHTML=master.filter(p=>(t!=='move'||p.cat==='원료육')&&(t==='in'||eligible(t,p.id).length)&&match($('productq').value,p.name,p.brand,p.origin,p.id)).map(p=>`<button class="listrow" data-product="${p.id}" data-type="${t}"><span class="grow"><strong>${e(p.name)}</strong><small>${e([p.brand,p.origin].filter(Boolean).join(' · ')||p.cat)}</small></span>${t==='in'?'':`<span class="right">${n(eligible(t,p.id).reduce((a,l)=>a+l.qty,0))} ${p.unit}</span>`}${icon('chev')}</button>`).join('')||'<p class="blank">일치하는 품목이 없습니다.</p>'};$('productq').oninput=draw;draw()}
function chooseLot(t,pid){const p=product(pid);sheet(p.name+' · LOT 선택',eligible(t,pid).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')).map(l=>`<button class="listrow" data-selectlot="${l.id}" data-type="${t}"><span class="grow"><strong>${e(l.expiry||'기한 없음')} · ${e(l.zone)}</strong><small>${e(l.brand)} · ${e(l.id)}</small></span><span class="right">${n(l.qty)} ${p.unit}</span>${icon('chev')}</button>`).join(''),'',()=>chooseProduct(t))}
function editLine(t,pid,lid=null,index=-1,repeat=null){const d=drafts[t],p=product(pid),l=lots.find(x=>x.id===lid),old=index>=0?d.lines[index]:repeat||{},isIn=t==='in';const initial={pid,lot:lid,qty:old.qty??'',price:old.price??'',zone:old.zone||l?.zone||(p.cat==='원료육'?'':p.cat==='완제품'?'냉동고':'상온'),expiry:old.expiry??l?.expiry??'',brand:old.brand??l?.brand??p.brand,origin:old.origin??l?.origin??p.origin};const options=(a,val)=>a.map(x=>`<option ${x===val?'selected':''}>${e(x)}</option>`).join('');sheet(p.name,`<p style="font-size:12px;color:var(--muted);margin-bottom:10px">${e(p.cat)}${l?' · LOT '+e(l.id)+' · '+e(l.zone):''}</p>${l?`<div class="detailtotal" style="margin-bottom:12px"><span>현재 재고</span><b>${n(l.qty)} ${p.unit}</b></div>`:''}<label class="field">${t==='in'?'입고':t==='out'?'출고':'이동'} 수량 (${p.unit})<div class="qtyfield"><input id="qty" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0" value="${e(initial.qty)}">${l?'<button id="allqty">전량</button>':''}</div></label>${isIn?`<div class="pair"><label class="field">보관 창고<select id="linezone"><option value="" disabled hidden ${!initial.zone?'selected':''}>선택</option>${options(['냉동고','냉장고','상온'],initial.zone)}</select></label><label class="field">소비기한<input type="date" id="expiry" value="${e(initial.expiry)}"></label></div><div class="pair"><label class="field">원산지<input id="origin" value="${e(initial.origin)}" placeholder="입력"></label><label class="field">브랜드<input id="brand" value="${e(initial.brand)}" placeholder="입력"></label></div>`:''}${isIn||t==='out'&&d.kind==='업체'?`<label class="field">단가 (원) · 선택<input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" value="${e(initial.price)}"></label>`:''}<div class="error" id="lineerror" role="alert"></div>`,`${index>=0?'<button class="secondary" id="deleteline">삭제</button>':isIn?'<button class="secondary" id="repeatline">같은 품목 계속</button>':''}<button class="primary" id="lineok">${index>=0?'수정 완료':'추가'}</button>`,()=>{if(index>=0||repeat)dismiss();else if(isIn)chooseProduct(t);else chooseLot(t,pid)});if(l)$('allqty').onclick=()=>{$('qty').value=Math.max(0,l.qty-d.lines.filter((x,i)=>i!==index&&x.lot===lid).reduce((a,x)=>a+x.qty,0));$('qty').focus()};const commit=repeatNext=>{const qty=Number($('qty').value),price=Number($('price')?.value||0),err=$('lineerror'),used=d.lines.filter((x,i)=>i!==index&&x.lot===lid).reduce((a,x)=>a+x.qty,0);if(!Number.isFinite(qty)||qty<=0||Math.abs(qty*100-Math.round(qty*100))>1e-6){err.textContent='수량을 0보다 크게 입력하세요 (소수 둘째 자리까지).';return}if(l&&qty+used>l.qty+1e-8){err.textContent='현재 재고를 초과합니다. 남은 수량 '+n(l.qty-used)+' '+p.unit;return}if(!Number.isFinite(price)||price<0){err.textContent='단가를 확인하세요.';return}const x={...initial,qty,price,zone:$('linezone')?.value??initial.zone,expiry:$('expiry')?.value??initial.expiry,origin:$('origin')?.value.trim()??initial.origin,brand:$('brand')?.value.trim()??initial.brand};if(isIn&&(!x.zone||p.cat!=='부자재'&&!x.expiry||p.cat==='원료육'&&(!x.origin||!x.brand&&x.origin!=='국내산'||x.zone==='상온'))){err.textContent='창고, 소비기한, 원산지와 수입 브랜드를 확인하세요.';return}if(index>=0)d.lines[index]=x;else d.lines.push(x);dismiss();render();if(repeatNext)editLine(t,pid,null,-1,{...x,qty:'',price:'',expiry:''});};$('lineok').onclick=()=>commit(false);if($('repeatline'))$('repeatline').onclick=()=>commit(true);if($('deleteline'))$('deleteline').onclick=()=>{d.lines.splice(index,1);dismiss();render()}}
function saveReview(t){const d=drafts[t],err=$('workerror');if(!d.date||!d.lines.length||t==='in'&&!d.partner||t==='out'&&(!d.kind||!d.partner&&d.kind!=='현장')){err.textContent='날짜, 품목 및 필수 정보를 확인하세요.';return}const used={};for(const x of d.lines){if(x.lot){used[x.lot]=(used[x.lot]||0)+x.qty;const l=lots.find(z=>z.id===x.lot);if(!l||used[x.lot]>l.qty+1e-8){err.textContent='재고가 부족합니다. 수량을 다시 확인하세요.';return}}}sheet('저장 확인',`<div class="detailtotal"><span>${names[t]} · ${e(d.date)}</span><b>${e(totals(d.lines))}</b></div><div class="section"><h2>${e(d.partner||(t==='move'?d.mode:d.kind)||'')} · ${d.lines.length}개 품목</h2></div>${d.lines.map(x=>`<div class="listrow"><span class="grow"><strong>${e(product(x.pid).name)}</strong><small>${e([x.zone,x.expiry,x.lot].filter(Boolean).join(' · '))}</small></span><span class="right">${n(x.qty)} ${product(x.pid).unit}</span></div>`).join('')}<p style="font-size:12px;color:var(--muted);margin-top:10px">테스트 데이터만 변경됩니다.</p>`,'<button class="secondary" id="savecancel">취소</button><button class="primary" id="saveconfirm">저장 확정</button>');$('saveconfirm').onclick=()=>{const snapshot=structuredClone(d);for(const x of d.lines){if(t==='in')lots.push({...x,id:'T-'+(lots.length+1),vendor:d.partner});else{const l=lots.find(z=>z.id===x.lot);l.qty=Math.round((l.qty-x.qty)*100)/100;if(t==='move'&&d.mode!=='현장 출고')lots.push({...l,id:'T-'+(lots.length+1),qty:x.qty,zone:d.mode==='해동'?'냉장고':'냉동고'})}}history.unshift({type:t,...snapshot,id:'TEST-'+(history.length+1)});drafts[t]=fresh(t);dismiss();render();notify(names[t]+' 테스트 저장 완료')}}
function renderHistory(){$('app').innerHTML=brand()+heading('입출고 내역')+`<main class="main"><div class="historytabs"><div class="segments">${['전체','입고','출고','이동'].map(k=>`<button data-hkind="${k}" class="${historyKind===k?'on':''}">${k}</button>`).join('')}</div></div><div class="date-range"><span>${range[0]} ~ ${range[1]}</span><button id="range">기간 설정</button></div><div class="stocklist">${history.filter(h=>(historyKind==='전체'||names[h.type]===historyKind)&&h.date>=range[0]&&h.date<=range[1]).map(h=>`<button class="listrow" data-history="${h.id}"><span class="grow"><span class="pill">${names[h.type]}</span><strong>${e(product(h.lines[0].pid).name)}${h.lines.length>1?' 외 '+(h.lines.length-1)+'건':''}</strong><small>${e(h.date)} · ${e(h.partner||(h.type==='move'?h.mode:h.kind))}</small></span><span class="right">${e(totals(h.lines))}</span>${icon('chev')}</button>`).join('')||'<p class="blank">해당 기간의 테스트 기록이 없습니다.</p>'}</div></main>`+nav();$('range').onclick=()=>sheet('기간 설정',`<div class="segments"><button id="todayrange">오늘</button><button id="monthrange">이번 달</button></div><label class="field">시작일<input id="startdate" type="date" value="${range[0]}"></label><label class="field">종료일<input id="enddate" type="date" value="${range[1]}"></label><div id="rangeerror" class="error"></div>`,'<button class="primary" id="rangeok">적용</button>')}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const ds=b.dataset,id=b.id;if(ds.nav)return go(ds.nav);if(ds.zone){zone=ds.zone;render()}if(ds.cat){cat=ds.cat;dismiss();render()}if(ds.stock)stockDetail(ds.stock);if(ds.lotaction){const l=lots.find(x=>x.id===ds.id),t=ds.lotaction,d=drafts[t];if(t==='move'){const m=l.zone==='냉동고'?'해동':'재냉동';if(d.lines.length&&d.mode!==m){notify('작성 중인 이동을 먼저 저장하거나 초기화하세요.');return}d.mode=m}go(t);if(t==='out'&&!d.kind){sheet('출고구분 선택',kinds.filter(k=>k!=='현장'||l.zone==='냉장고'&&product(l.pid).cat==='원료육').map(k=>`<button class="listrow" data-directkind="${k}" data-id="${l.id}"><span class="grow">${k}</span>${icon('chev')}</button>`).join(''));return}if(t==='out'&&d.kind==='현장'&&(l.zone!=='냉장고'||product(l.pid).cat!=='원료육')){notify('현장 출고는 냉장 원료육만 가능합니다.');return}const i=d.lines.findIndex(x=>x.lot===l.id);editLine(t,l.pid,l.id,i)}if(ds.directkind){const l=lots.find(x=>x.id===ds.id);drafts.out.kind=ds.directkind;dismiss();render();editLine('out',l.pid,l.id)}if(ds.partner){drafts[page].partner=ds.partner;dismiss();render()}if(ds.product){if(ds.type==='in')editLine('in',ds.product);else chooseLot(ds.type,ds.product)}if(ds.selectlot){const l=lots.find(x=>x.id===ds.selectlot),i=drafts[ds.type].lines.findIndex(x=>x.lot===l.id);editLine(ds.type,l.pid,l.id,i)}if(ds.edit!==undefined){const x=drafts[page].lines[Number(ds.edit)];editLine(page,x.pid,x.lot,Number(ds.edit))}if(ds.mode){const d=drafts.move;if(d.lines.length&&d.mode!==ds.mode){notify('작성 중인 이동을 먼저 저장하거나 초기화하세요.');return}d.mode=ds.mode;render()}if(ds.hkind){historyKind=ds.hkind;render()}if(ds.history){const h=history.find(x=>x.id===ds.history);sheet(h.id,`<p>${names[h.type]} · ${e(h.date)} · ${e(h.partner||(h.type==='move'?h.mode:h.kind))}</p>${h.lines.map(x=>`<div class="listrow"><span class="grow"><strong>${e(product(x.pid).name)}</strong><small>${e(x.lot||x.expiry)}</small></span><span class="right">${n(x.qty)} ${product(x.pid).unit}</span></div>`).join('')}`)}if(['joinok','cancelreset','savecancel'].includes(id))dismiss();if(id==='confirmreset'){drafts[page]=fresh(page);dismiss();render()}if(id==='todayrange')$('startdate').value=$('enddate').value=today;if(id==='monthrange'){$('startdate').value='2026-11-01';$('enddate').value=today}if(id==='rangeok'){const a=$('startdate').value,z=$('enddate').value;if(!a||!z||a>z){$('rangeerror').textContent='시작일과 종료일을 확인하세요.';return}range=[a,z];dismiss();render()}});
render();
