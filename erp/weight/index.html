<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f6"><meta name="apple-mobile-web-app-capable" content="yes"><title>중량 계산기</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f6;color:#202024;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}main{max-width:500px;margin:auto;padding:22px 16px calc(30px + env(safe-area-inset-bottom))}h1{font-size:25px;letter-spacing:-1px;margin:0 0 4px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.tag{font-size:12px;color:#73737b}section{background:white;border-radius:17px;padding:16px;margin-bottom:12px}button,input{font:inherit}button{cursor:pointer;border:0;background:#ededf0;color:#25252a;border-radius:12px;min-height:46px;font-weight:600;padding:10px 12px}button:disabled{opacity:.4;cursor:default}button:active:not(:disabled){transform:scale(.98)}input{width:100%;min-width:0;border:1px solid #d8d8de;border-radius:10px;padding:11px;background:#fff;color:#202024}input:focus{outline:2px solid #777;outline-offset:1px}label,.caption{font-size:13px;color:#66666f}.total{text-align:center;padding:23px 12px 18px}.total small{font-size:17px;font-weight:500}.total strong{display:block;font-size:clamp(32px,10vw,46px);font-variant-numeric:tabular-nums;letter-spacing:-1.5px;overflow-wrap:anywhere;line-height:1.25}.total .count{font-size:21px;font-weight:650;margin-top:8px}.target{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:15px}.target input{width:78px;text-align:center;padding:6px}.progress{height:5px;background:#eeeef0;border-radius:5px;overflow:hidden;margin-top:14px}.progress div{height:100%;background:#555;transition:width .2s}.last{font-size:14px;text-align:center;color:#44444c;margin-top:10px;min-height:20px}.voice{text-align:center}.mic{display:flex;align-items:center;justify-content:center;gap:9px;background:#242427;color:#fff;width:100%;min-height:65px;font-size:19px}.mic[aria-pressed=true]{background:#3c3c42}.mic svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.status{min-height:42px;margin:10px 0 3px;color:#56565e;font-size:13px;overflow-wrap:anywhere}.status.warn{color:#a32929}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.manual{display:flex;gap:8px;margin-top:8px}.manual input{flex:1}.manual button{min-width:72px}.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.list-head h2{font-size:16px;margin:0}.history{max-height:290px;overflow:auto}.entry{display:flex;align-items:center;gap:8px;border-top:1px solid #eeeef0;padding:7px 0}.entry span{color:#666;font-size:13px}.entry strong{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums}.entry button{background:transparent;font-size:13px;min-height:44px;padding:8px}.empty{color:#777;font-size:14px;text-align:center;padding:15px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button:last-child{background:#fff;color:#9b3030}.note{font-size:12px;color:#666;margin:10px 4px}.done{font-size:13px;font-weight:600;color:#23633d;text-align:center;margin-top:8px}dialog{width:min(350px,90vw);border:0;border-radius:16px;padding:20px;color:#222}dialog::backdrop{background:#0006}dialog h2{font-size:18px;margin:0 0 12px}dialog .actions{margin-top:12px}
</style></head><body><main><header><div><h1>중량 계산기</h1><div class="tag">음성 · 박스별 집계</div></div><span class="tag">개인용</span></header><section class="total"><div class="caption">총 중량</div><strong><span id="sum">0.00</span> <small>kg</small></strong><div class="count"><span id="count">0</span> 박스 <span id="goalText" class="tag"></span></div><div class="target"><label for="goal">목표 박스 수</label><input id="goal" type="number" min="0" max="10000" inputmode="numeric" value="100"></div><div class="progress"><div id="progress"></div></div><div id="last" class="last">아직 입력된 중량이 없습니다.</div><div id="done" class="done" hidden>목표 박스 수 도달</div></section><section class="voice"><button class="mic" id="mic" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span id="micLabel">음성 입력 시작</span></button><p id="status" class="status" role="status">한 박스씩 “이십 점 삼 오”라고 읽고 확인음을 기다리세요.</p><div class="actions"><button id="undo">직전 취소</button><button id="finish">집계 완료</button></div></section><section><label for="manual">직접 중량 입력 (kg)</label><form id="form" class="manual"><input id="manual" type="text" inputmode="decimal" autocomplete="off" placeholder="20.35"><button type="submit">추가</button></form></section><section><div class="list-head"><h2>입력 내역</h2><span class="tag" id="recordCount">0건</span></div><div id="history" class="history"></div></section><div class="bottom"><button id="copy">합계 복사</button><button id="reset">새 집계</button></div><p class="note">중량 기록은 이 브라우저에만 저장됩니다. 음성 인식은 브라우저의 음성 서비스를 사용하며 인터넷이 필요할 수 있습니다. 화면을 켜고 확인음과 박스 수를 확인해 주세요.</p></main><dialog id="edit"><form id="editForm"><h2 id="editTitle">중량 수정</h2><input id="editValue" inputmode="decimal" autocomplete="off" aria-label="수정 중량"><div class="actions"><button type="button" id="editCancel">취소</button><button type="submit">저장</button></div><button type="button" id="editDelete" style="width:100%;margin-top:8px;color:#9b3030;background:#fff">이 박스 삭제</button></form></dialog><script>
function parseWeight(raw){
 let s=String(raw).normalize('NFKC').toLowerCase().trim().replace(/[。!?]+$/g,'').replace(/(?:킬로그램|킬로|키로그램|키로|kg)\s*$/,'').trim();
 if(/^(끝|완료|종료|그만)$/.test(s))return {command:'stop'};
 if(/^(취소|직전 취소|마지막 취소)$/.test(s))return {command:'undo'};
 const d={'공':'0','영':'0','일':'1','이':'2','삼':'3','사':'4','오':'5','육':'6','륙':'6','칠':'7','팔':'8','구':'9'};
 s=s.replace(/쩜/g,'점').replace(/\s*점\s*/g,'.').replace(/\s*\.\s*/g,'.').replace(/(\d),(?=\d{3}(?:\.|$))/g,'$1');
 function digits(x){return [...x].map(c=>d[c]??c).join('')}
 function integer(x){
  x=x.replace(/\s/g,'');if(/^\d+$/.test(x))return Number(x);
  if(!/^[공영일이삼사오육륙칠팔구십백천\d]+$/.test(x))return NaN;
  if(!/[십백천]/.test(x))return Number(digits(x));
  let sum=0,n='',last=10000;
  for(const ch of x){if(/[십백천]/.test(ch)){const u={십:10,백:100,천:1000}[ch];if(u>=last||n.length>1||n==='0')return NaN;sum+=(n?Number(n):1)*u;n='';last=u;}else n+=digits(ch);}
  if(n.length>1)return NaN;return sum+Number(n||0);
 }
 const p=s.split('.');if(p.length>2||!p[0].trim())return null;
 if(/^\d+\s+\d/.test(p[0]))return null;
 let whole=integer(p[0]);let frac=p.length===2?digits(p[1].replace(/\s/g,'')):'';
 if(p.length===2&&!/^\d{1,3}$/.test(frac))return null;
 if(!Number.isInteger(whole)||whole<0||whole>9999)return null;
 const grams=whole*1000+Number(frac.padEnd(3,'0'));return grams>0?{grams}:null;
}
const $=id=>document.getElementById(id), KEY='personal-weight-v1';let weights=[],goal=100,editing=-1,running=false,recognizer=null,retry=0,restartTimer=null,lock=null,audio=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){weights=Array.isArray(saved.weights)?saved.weights.filter(x=>Number.isSafeInteger(x)&&x>0&&x<=9999999):[];goal=Number.isInteger(saved.goal)&&saved.goal>=0&&saved.goal<=10000?saved.goal:100}}catch{}
$('goal').value=goal;
function kg(n){return (n/1000).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:3})}
function message(s,warn=false){$('status').textContent=s;$('status').classList.toggle('warn',warn)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({weights,goal}))}catch{message('기기 저장 실패 · 화면을 닫지 마세요.',true)}}
function render(){const sum=weights.reduce((a,b)=>a+b,0);$('sum').textContent=kg(sum);$('count').textContent=weights.length;$('goalText').textContent=goal?' / '+goal:'';$('recordCount').textContent=weights.length+'건';$('progress').style.width=(goal?Math.min(100,weights.length/goal*100):0)+'%';$('done').hidden=!(goal&&weights.length>=goal);$('done').textContent=weights.length===goal?'목표 박스 수 도달':'목표보다 '+(weights.length-goal)+'박스 많습니다.';$('last').textContent=weights.length?'최근 '+weights.length+'번 · '+kg(weights[weights.length-1])+' kg':'아직 입력된 중량이 없습니다.';$('undo').disabled=!weights.length;$('history').innerHTML=weights.length?weights.map((n,i)=>'<div class="entry"><span>'+(i+1)+'번</span><strong>'+kg(n)+' kg</strong><button data-edit="'+i+'">수정</button></div>').reverse().join(''):'<div class="empty">입력 내역 없음</div>';save()}
function prepareAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{}}
function beep(kind='ok'){try{if(!audio||audio.state!=='running')return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=kind==='error'?260:kind==='done'?1150:790;g.gain.setValueAtTime(.10,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.14)}catch{}}
function add(n,voice=false){if(!Number.isSafeInteger(n)||n<=0)return;weights.push(n);render();const hit=goal&&weights.length===goal;message(weights.length+'번 · '+kg(n)+' kg 추가'+(hit?' · 목표 도달':''));if(voice)beep(hit?'done':'ok');if(hit&&running)stop('목표 '+goal+'박스 도달 · 집계를 종료했습니다.')}
function undo(){if(!weights.length){message('취소할 중량이 없습니다.',true);return}const n=weights.pop();render();message(kg(n)+' kg 취소 · '+weights.length+'박스');beep()}
function stop(s='음성 입력 종료'){running=false;clearTimeout(restartTimer);if(recognizer){const r=recognizer;recognizer=null;try{r.abort()}catch{}}if(lock){lock.release().catch(()=>{});lock=null}$('mic').setAttribute('aria-pressed','false');$('micLabel').textContent='음성 입력 시작';message(s)}
async function keepAwake(){try{if(navigator.wakeLock&&running){const x=await navigator.wakeLock.request('screen');if(running)lock=x;else x.release().catch(()=>{})}}catch{}}
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
function launch(){if(!running)return;const r=new Speech();recognizer=r;r.lang='ko-KR';r.continuous=false;r.interimResults=false;r.maxAlternatives=3;let accepted=false;
r.onstart=()=>{if(r!==recognizer)return;message('듣고 있습니다 · 한 박스씩 말씀하세요.')};
r.onresult=e=>{if(r!==recognizer||!running||accepted)return;for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;accepted=true;retry=0;const alts=Array.from(e.results[i]).map(x=>({text:x.transcript,p:parseWeight(x.transcript)}));const top=alts[0];if(!top.p){message('인식 불확실: '+top.text+' · 다시 읽어 주세요.',true);beep('error');return}if(top.p.command==='stop'){stop('집계 완료 · '+weights.length+'박스 / '+kg(weights.reduce((a,b)=>a+b,0))+' kg');return}if(top.p.command==='undo'){undo();return}const distinct=new Set(alts.filter(a=>a.p?.grams).map(a=>a.p.grams));if(distinct.size>1){message('중량 후보가 다릅니다: '+top.text+' · 다시 읽어 주세요.',true);beep('error');return}add(top.p.grams,true);return}};
r.onerror=e=>{if(r!==recognizer||!running)return;if(['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].includes(e.error)){stop('음성 인식 중단: '+e.error+' · 마이크 권한, 연결 상태를 확인하세요.');return}if(e.error==='no-speech'){retry=0;return}if(e.error==='aborted')return;retry++;if(retry>=3)stop('음성 인식이 반복 중단되었습니다. 다시 시작해 주세요.')};
r.onend=()=>{if(r!==recognizer)return;recognizer=null;if(running)restartTimer=setTimeout(launch,220)};
try{r.start()}catch{stop('마이크를 시작하지 못했습니다. 다시 눌러 주세요.')}
}
$('mic').onclick=()=>{if(running){stop();return}if(!Speech){message('이 브라우저는 음성 인식을 지원하지 않습니다. 안드로이드 Chrome에서 열어 주세요.',true);return}if(goal&&weights.length>=goal){message('이미 목표 수량에 도달했습니다. 목표 수량을 바꾸거나 새 집계를 시작하세요.',true);return}prepareAudio();running=true;retry=0;$('mic').setAttribute('aria-pressed','true');$('micLabel').textContent='음성 입력 중 · 정지';message('마이크 연결 중…');keepAwake();launch()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&running)stop('화면 전환으로 음성 입력을 중지했습니다.')});
$('goal').onchange=()=>{const n=Number($('goal').value);goal=Number.isInteger(n)&&n>=0&&n<=10000?n:100;$('goal').value=goal;render();if(running&&goal&&weights.length>=goal)stop('목표 박스 수에 도달했습니다.')};
$('form').onsubmit=e=>{e.preventDefault();let p=parseWeight($('manual').value);if(!p?.grams){message('중량을 정확히 입력하세요. 예: 20.35',true);return}add(p.grams);$('manual').value='';$('manual').focus()};
$('undo').onclick=undo;$('finish').onclick=()=>stop('집계 완료 · '+weights.length+'박스 / '+kg(weights.reduce((a,b)=>a+b,0))+' kg');
$('history').onclick=e=>{const b=e.target.closest('[data-edit]');if(!b)return;if(running)stop();editing=Number(b.dataset.edit);$('editTitle').textContent=(editing+1)+'번 박스 수정';$('editValue').value=String(weights[editing]/1000);$('edit').showModal()};
$('editCancel').onclick=()=>$('edit').close();$('editForm').onsubmit=e=>{e.preventDefault();const p=parseWeight($('editValue').value);if(!p?.grams){$('editValue').setCustomValidity('올바른 중량을 입력하세요.');$('editValue').reportValidity();return}weights[editing]=p.grams;$('edit').close();render();message('중량을 수정했습니다.')};$('editValue').oninput=()=>$('editValue').setCustomValidity('');
$('editDelete').onclick=()=>{if(confirm('이 박스의 기록을 삭제하시겠습니까?')){weights.splice(editing,1);$('edit').close();render();message('박스 기록 삭제 완료')}};
$('copy').onclick=async()=>{const text=weights.length+'박스 / '+kg(weights.reduce((a,b)=>a+b,0))+' kg';try{await navigator.clipboard.writeText(text);message('복사 완료 · '+text)}catch{prompt('합계 복사',text)}};
$('reset').onclick=()=>{if(weights.length&&!confirm('기존 집계 '+weights.length+'박스를 모두 지우고 새로 시작할까요?'))return;stop();weights=[];render();message('새 집계를 시작하세요.')};
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
