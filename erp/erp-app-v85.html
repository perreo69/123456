/* 재고표 작업 열은 항상 화면 우측에 표시 */
.stock-table th:last-child,.stock-table td:last-child{position:sticky;right:0;z-index:2;box-shadow:-1px 0 0 #d2d2d2;background:#fff}
.stock-table thead th:last-child{z-index:3;background:#e9e9e9}
.stock-table .product-row td:last-child{background:#ededed}
.stock-table .lot-line td:last-child{background:#fff}
.stock-table .action-cell{min-width:80px;text-align:center;padding:6px 8px}
.stock-table .action-btn{min-width:68px;white-space:nowrap}

/* v10: 닫힌 품목 흰색, 펼친 품목 제목만 중립적인 연회색 */
.stock-table tbody>tr.product-row>td{background:#fff}
.stock-table tbody>tr.product-row:hover>td{background:#fafafa}
.stock-table tbody>tr.product-row.expanded>td,
.stock-table tbody>tr.product-row.expanded:hover>td{background:#f1f1f1}
.stock-table tbody>tr.lot-line>td{background:#fff}
.stock-table tbody>tr.lot-line:hover>td{background:#fdfdfd}
.stock-table tbody>tr.product-row>td:last-child{background:#fff}
.stock-table tbody>tr.product-row.expanded>td:last-child,
.stock-table tbody>tr.product-row.expanded:hover>td:last-child{background:#f1f1f1}
.stock-table tbody>tr.lot-line>td:last-child{background:#fff}
.stock-table .product-row .product-name{font-weight:700}
.stock-table .product-row.expanded .product-name{font-weight:800}
.stock-table .collapse-btn,.stock-table .expand-all{color:#555}
/* LOT 다중 선택 작업창 */
.drawer.wide{width:min(900px,100vw)}
.product-search-line{display:flex;align-items:center;gap:12px}
.product-search-line>input{flex:1;min-width:0}
.chosen-type{color:#646464;font-size:12px;white-space:nowrap}
.product-matches{background:#fff;border:1px solid #d6d6d6;border-radius:5px;max-height:190px;overflow-y:auto;box-shadow:0 8px 22px #00000010;position:relative;z-index:4}
.product-suggestion{border:0;border-bottom:1px solid #eeeeee;background:white;width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#343434;text-align:left;font-size:12px}
.product-suggestion:hover,.product-suggestion:focus-visible{background:#f1f1f1}
.product-suggestion span{color:#747474}
.no-product,.no-lots{text-align:center;padding:16px;color:#777}
.drawer.wide .form-body{padding-top:20px}
.drawer.wide .action-lots{overflow-x:auto;border:1px solid #dadada;border-radius:6px}

const V66_CATEGORIES=['전체','원료육','완제품','소스','향신료','야채류','부재료','부자재','분류 확인'];
function v95CodeKey(v){return String(v??'').trim().normalize('NFKC').toUpperCase();}
function v95CodeEntries(){return [...V17_ITEMS,...(state.v66CustomCatalog||[]),...(state.v37Custom||[]),...state.products.flatMap(p=>[{code:p.id,owner:p.id},{code:p.itemCode||p.id,owner:p.id}])];}
function v95CodeTaken(code,owner=''){const k=v95CodeKey(code);return !!k&&v95CodeEntries().some(p=>v95CodeKey(p.code)===k&&(!owner||p.owner!==owner));}
function v95NextCode(){let n=1;for(const p of v95CodeEntries()){const m=/^ITEM-(\d+)$/i.exec(String(p.code));if(m)n=Math.max(n,Number(m[1])+1);}while(v95CodeTaken('ITEM-'+String(n).padStart(6,'0')))n++;return 'ITEM-'+String(n).padStart(6,'0');}
function v95MeatCode(p){return p?.itemCode||p?.id||'';}

function v66GroupFor(p){return state.v66CategoryOverrides?.[p.code]||p.group;}
function v86Group(category){return ({meat:'원료육',finished_own:'완제품',finished_buy:'완제품',finished_unspecified:'완제품',sauce:'소스',spice:'향신료',vegetable:'야채류',ingredient_other:'부재료',supplies:'부자재',pending:'분류 확인'})[category]||category||'분류 확인';}
function v86Key(group,name,spec){return JSON.stringify([v86Group(group),normName(name),v86Group(group)==='원료육'?'':normName(spec)]);}
function v86UsageIndex(){
 const index=new Map();
 const put=(group,name,spec,active)=>{const k=v86Key(group,name,spec);index.set(k,(index.get(k)||false)||active!==false);};
 for(const p of [...V17_ITEMS,...(state.v66CustomCatalog||[])])put(v66GroupFor(p),p.name,p.spec,p.active);
 for(const p of state.products)put('원료육',p.name,'',p.active);
 return index;
}
function v86IsActive(group,name,spec,fallback=true,index){
 const k=v86Key(group,name,spec),settings=state.v86Usage||{};
 if(Object.prototype.hasOwnProperty.call(settings,k))return settings[k]===true;
 const i=index||v86UsageIndex();return i.has(k)?i.get(k):fallback!==false;
}
function v66ProductList(){
 const catalog=V17_ITEMS.map(p=>({kind:'imported',...p,group:v66GroupFor(p),info:window.__V66_PRODUCT_META__?.[p.code]||{}}));
 for(const p of state.v66CustomCatalog||[])catalog.push({kind:'custom',...p,group:v66GroupFor(p),info:{source:'직접 등록'}});
 // The independent meat item master is left intact. These rows are shown alongside imported source SKUs.
 for(const p of state.products){
  // Product master has no brand column; show distinct brands attached to its LOTs.
  const lots=state.items.filter(l=>l.productId===p.id);
  const brands=[...new Set(lots.map(l=>String(l.brand||'').trim()).filter(Boolean))];
  const origins=[...new Set(lots.map(l=>String(l.origin||'').trim()).filter(Boolean))];
  catalog.push({kind:'meat',code:v95MeatCode(p),internalId:p.id,group:'원료육',name:p.name,spec:'',unit:'kg',type:p.type,active:p.active,
   info:{source:'원료육 등록',brands,origins}});
 }
 const index=v86UsageIndex(),known=new Set(catalog.map(p=>v86Key(p.group,p.name,p.spec)));
 for(const r of [...(window.__ERP_CATEGORY_SEED__||[]),...(state.extraLots||[]),...(state.extraProducts||[])]){const group=v86Group(r.category),k=v86Key(group,r.name,r.spec);if(!r.name||known.has(k))continue;known.add(k);catalog.push({kind:'extra',code:'기타-'+(catalog.length+1),group,name:r.name,spec:r.spec||'',unit:r.unit||'',active:true,info:{source:'기존 재고 품목',brand:r.brand,origin:r.origin}});}
 const used=new Map(),out=[];
 for(const p of catalog){p.usageKey=v86Key(p.group,p.name,p.spec);p.active=v86IsActive(p.group,p.name,p.spec,p.active,index);
  if(p.kind==='meat'){out.push(p);continue;}
  const key=[p.group,normName(p.name),normName(p.spec),normName(p.unit)].join('|');
  if(used.has(key)){
   const first=used.get(key);first.info={...first.info,duplicateCodes:[...new Set([...(first.info.duplicateCodes||[first.code]),p.code])].sort()};
   continue;
  }
  used.set(key,p);out.push(p);
 }
 return out;
}

let v40CurrentFilter=null;
function v40CreateFilters(columns,getCandidates,getValue,onChange){
 const selected=new Map();let order={key:'name',direction:'asc'},opened='';
 const self={
   close(){document.getElementById('v40ColumnPopup')?.remove();opened='';},
   reset(){selected.clear();order={key:'name',direction:'asc'};self.close();self.updateButtons();onChange();},
   updateButtons(){document.querySelectorAll('[data-v40-filter]').forEach(b=>b.classList.toggle('applied',selected.has(b.dataset.v40Filter)));},
   header(){return columns.map(c=>`<th class="${c.kind==='number'?'numeric':''}"><div class="th-wrap"><span>${esc(c.label)}</span><button type="button" class="excel-filter-btn" data-v40-filter="${esc(c.key)}" title="${esc(c.label)} 정렬 및 필터" aria-label="${esc(c.label)} 정렬 및 필터" aria-haspopup="dialog"><span class="v78-filter-chevron" aria-hidden="true">⌄</span></button></div></th>`).join('');},
   apply(list){
     const kept=list.filter(g=>[...selected].every(([key,values])=>values.has(String(getValue(g,key)??''))));
     const c=columns.find(c=>c.key===order.key)||columns[0];
     kept.sort((a,b)=>{
       const av=getValue(a,order.key),bv=getValue(b,order.key);
       let diff;
       if(c.kind==='number')diff=(Number(av)||0)-(Number(bv)||0);
       else diff=order.key==='name'?v82NameCompare(av,bv):String(av??'').localeCompare(String(bv??''),'ko',{numeric:true});
       return (diff||v82NameCompare(getValue(a,'name'),getValue(b,'name')))*(order.direction==='asc'?1:-1);
     });
     return kept;
   },
   bind(head){
     head.onclick=e=>{
       const b=e.target.closest('[data-v40-filter]');if(!b)return;
       e.preventDefault();e.stopPropagation();
       if(opened===b.dataset.v40Filter){self.close();return;}
       self.open(b.dataset.v40Filter,b);
     };
   },
   open(key,anchor){
     self.close();opened=key;
     const col=columns.find(c=>c.key===key);if(!col)return;
     const values=[...new Set(getCandidates().map(g=>String(getValue(g,key)??'')))].sort((a,b)=>col.kind==='number'?(Number(a)||0)-(Number(b)||0):a.localeCompare(b,'ko',{numeric:true}));
     let staged=selected.has(key)?new Set(selected.get(key)):new Set(values);
     const pop=document.createElement('div');pop.id='v40ColumnPopup';pop.className='excel-popup';pop.setAttribute('role','dialog');pop.setAttribute('aria-label',col.label+' 필터');
     pop.innerHTML=`<div class="popup-menu"><button type="button" data-v40-order="asc">↑ ${col.kind==='number'?'오름차순':'텍스트 오름차순'} 정렬</button><button type="button" data-v40-order="desc">↓ ${col.kind==='number'?'내림차순':'텍스트 내림차순'} 정렬</button></div><div class="popup-divider"></div><input class="option-search" type="search" placeholder="검색" aria-label="필터 값 검색"><div class="option-list"></div><div class="popup-actions"><button type="button" data-v40-cancel>취소</button><button type="button" data-v40-apply>확인</button></div>`;
     document.body.appendChild(pop);
     const r=anchor.getBoundingClientRect(),width=pop.offsetWidth,height=Math.min(520,innerHeight*.82);
     pop.style.left=Math.max(8,Math.min(innerWidth-width-8,r.left-34))+'px';
     pop.style.top=Math.max(8,Math.min(innerHeight-height-8,r.bottom+3))+'px';
     const search=pop.querySelector('input.option-search'),options=pop.querySelector('.option-list');
     const redraw=()=>{
       const needle=search.value.toLocaleLowerCase();
       const current=values.filter(v=>(v||'(빈 셀)').toLocaleLowerCase().includes(needle));
       options.innerHTML=`<label class="filter-option all-option"><input type="checkbox" data-v40-all ${current.length&&current.every(v=>staged.has(v))?'checked':''}><span>(모두 선택)</span></label>`+current.map((v,i)=>`<label class="filter-option"><input type="checkbox" data-v40-index="${i}" ${staged.has(v)?'checked':''}><span title="${esc(v||'(빈 셀)')}">${esc(v||'(빈 셀)')}</span></label>`).join('');
       options.querySelector('[data-v40-all]').onchange=e=>{current.forEach(v=>e.target.checked?staged.add(v):staged.delete(v));redraw();};
       options.querySelectorAll('[data-v40-index]').forEach(input=>input.onchange=e=>{const v=current[Number(input.dataset.v40Index)];e.target.checked?staged.add(v):staged.delete(v);options.querySelector('[data-v40-all]').checked=current.length>0&&current.every(x=>staged.has(x));});
     };
     search.oninput=redraw;
     pop.querySelectorAll('[data-v40-order]').forEach(btn=>btn.onclick=()=>{order={key,direction:btn.dataset.v40Order};self.close();onChange();});
     pop.querySelector('[data-v40-cancel]').onclick=()=>self.close();
     pop.querySelector('[data-v40-apply]').onclick=()=>{
       if(values.every(v=>staged.has(v)))selected.delete(key);else selected.set(key,new Set(staged));
       self.close();self.updateButtons();onChange();
     };
     redraw();search.focus();
   }
 };
 v40CurrentFilter?.close();v40CurrentFilter=self;
 return self;
}

const FG20_REFERENCE=[{"code": "0000002085", "name": "오븐바베큐치킨 2.5kg", "spec": "2.5kg*4팩", "unit": "팩"}, {"code": "0000001814", "name": "오븐바베큐치킨 큐브 1kg", "spec": "1kg*12팩", "unit": "팩"}, {"code": "0000002057", "name": "오븐솔트치킨 2kg", "spec": "2kg*5팩", "unit": "팩"}, {"code": "0000002312", "name": "오븐솔트치킨 400g", "spec": "400g*20팩", "unit": "팩"}];
function fg20Parse(name,spec){
  const raw=String(name||''),rawSpec=String(spec||'');
  const amount=rawSpec.match(/(\d+(?:\.\d+)?)\s*(kg|g)\s*(?:[xX×*]\s*(\d+)\s*(?:팩|개|ea|EA|봉))?/i);
  const fromName=raw.match(/\s+(\d+(?:\.\d+)?)\s*(kg|g)\s*$/i);
  const weight=amount?amount[1]+' '+amount[2]:(fromName?fromName[1]+' '+fromName[2]:'—');
  const count=amount&&amount[3]?Number(amount[3])+'팩':'—';
  const clean=fromName?raw.slice(0,fromName.index).trim():raw;
  return {name:clean||raw,weight,pack:count};
}
function fg20Weight(r){
  const actual=Number(r.kg)||0;if(actual>0)return actual;
  const x=fg20Parse(r.name,r.spec),m=x.weight.match(/^(\d+(?:\.\d+)?)\s*(kg|g)$/i);
  const packs=Number(r.packs||0);
  return m&&packs>0?Math.round(packs*Number(m[1])*(m[2].toLowerCase()==='g'?0.001:1)*1000)/1000:null;
}

function v36Save(){

 for(const e of picked){
  if(!Number.isFinite(e.qty)||e.qty<=0||Math.abs(e.qty*100-Math.round(e.qty*100))>0.00001){error.textContent=`${e.l.id} 이동 수량은 0보다 큰 kg 단위(소수 둘째 자리까지)로 입력해 주세요.`;return;}

 }

   if(mode==='refreeze'&&lot.traceThawDate&&date<lot.traceThawDate)throw Error('재냉동일은 해동일 이후여야 합니다.');

  }

function v38PlanAnalysis(code,qty){
 const p=v37FindSku(code),recipe=state.v37Recipes?.[code];if(!p||!recipe||!Number.isFinite(qty)||qty<=0)return {p,recipe,lines:[],shortages:0,unknown:0,knownCost:0};
 const inventory=new Map(v18Products('').map(g=>[g.key,g]));let shortages=0,unknown=0,knownCost=0;
 const lines=recipe.lines.map(item=>{
   const group=inventory.get(item.key),need=v18Round(Number(item.qty)*qty/Number(recipe.yieldQty)),lots=[...(group?.lots||[])].sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'));
   const available=lots.reduce((s,l)=>s+Number(l.available||0),0),unitMismatch=Boolean(group&&group.unit&&item.unit&&group.unit!==item.unit);
   let left=need,estimate=0,unpriced=false;
   for(const l of lots){if(left<=.000001)break;const used=Math.min(left,Number(l.available)||0),price=v37LotCost(l);if(price===null)unpriced=true;else estimate+=used*price;left-=used;}
   const missing=!group||available+.000001<need||unitMismatch;
   if(missing)shortages++;
   if(unpriced||missing)unknown++;
   if(!unpriced&&!missing)knownCost+=estimate;
   return {item,group,need,available,missing,unitMismatch,unpriced,estimate,unit:item.unit||group?.unit||''};
 });
 return {p,recipe,lines,shortages,unknown,knownCost};
}

// v30: 날짜 4자리(MMDD=현재 연도), 6자리(YYMMDD=20YY), 8자리(YYYYMMDD) 입력 지원.
// 4·6자리는 더 긴 날짜를 계속 입력할 수 있도록 포커스를 벗어나거나 Enter를 누를 때 확정합니다.
function normalizeIntakeDate(value){
 const v=String(value||'').trim();
 if(!v)return '';
 let y,mo,day,m;
 if((m=/^(\d{2})(\d{2})$/.exec(v))){
  y=Number(today().slice(0,4));mo=Number(m[1]);day=Number(m[2]);
 }else if((m=/^(\d{2})(\d{2})(\d{2})$/.exec(v))){
  y=2000+Number(m[1]);mo=Number(m[2]);day=Number(m[3]);
 }else if((m=/^(\d{4})(\d{2})(\d{2})$/.exec(v))||
         (m=/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/.exec(v))){
  y=Number(m[1]);mo=Number(m[2]);day=Number(m[3]);
 }else return null;
 if(y<1900||y>2199||mo<1||mo>12||day<1||day>31)return null;
 if(day>new Date(y,mo,0).getDate())return null;
 return `${String(y).padStart(4,'0')}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function bindIntakeQuickDates(root){
 root.querySelectorAll('input[data-quick-date]').forEach(inp=>{
  if(inp.dataset.quickDateBound)return;
  inp.dataset.quickDateBound='yes';
  const cal=inp.closest('.quick-date')?.querySelector('.quick-date-calendar');
  // v31: 기존 날짜가 들어 있는 칸을 클릭하거나 Tab으로 이동하면 날짜 전체를 선택.
  // 기존 날짜를 지우지 않아도 새 숫자 4/6/8자리 입력으로 즉시 교체됩니다.
  inp.addEventListener('focus',()=>{if(inp.value)inp.select();});
  inp.addEventListener('mouseup',e=>{if(inp.value){e.preventDefault();inp.select();}});
  function sync(doChange){
   const previous=inp.value;
   const normalized=normalizeIntakeDate(inp.value);
   if(normalized===null){
    inp.setAttribute('aria-invalid','true');
    inp.title='날짜를 4·6·8자리로 입력해 주세요 (예: 1121, 281121, 20281121)';
    if(cal)cal.value='';
    return false;
   }
   inp.removeAttribute('aria-invalid');inp.removeAttribute('title');
   inp.value=normalized;
   if(cal)cal.value=normalized;
   if(doChange&&previous!==normalized)inp.dispatchEvent(new Event('change',{bubbles:true}));
   return true;
  }
  inp.addEventListener('input',()=>{
   inp.removeAttribute('aria-invalid');inp.removeAttribute('title');
   if(/^\d{8}$/.test(inp.value))sync(true);
   else if(/^\d{4}[-./]\d{2}[-./]\d{2}$/.test(inp.value))sync(true);
  });
  inp.addEventListener('blur',()=>sync(true));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sync(true);inp.blur();}});
  if(cal)cal.addEventListener('change',()=>{const previous=inp.value;inp.value=cal.value;sync(false);if(previous!==inp.value)inp.dispatchEvent(new Event('change',{bubbles:true}));});
 });
}

 const hit=v33Locate(lotId);if(!hit)return toast('입고 LOT를 찾지 못했습니다.');
 const {record:l,kind}=hit,batch=(state.receiptBatches||[]).find(x=>x.id===l.receiptId);
 const entry=batch?.entries?.find(e=>e.id===l.id)||null;
 const isOwn=(entry?.category||l.category)==='finished_own';
 const name=kind==='meat'?l.name:l.name;
 const initialQty=entry?Number(entry.qty):kind==='meat'?(Number(l.frozen)||0)+(Number(l.chilled)||0):Number(l.qty||0);
 const unit=entry?.unit||l.unit||'kg';
 v33CurrentEdit={id:l.id,kind,batchId:batch?.id||'',entryId:entry?.id||'',initialQty,unit,isOwn};

 <label>소비기한<input id="v33Expiry" type="date" value="${esc(l.expiry||entry?.expiry||'')}"></label>

function v33SaveLotEdit(){
 const info=v33CurrentEdit;if(!info)return;
 const hit=v33Locate(info.id);if(!hit)return v33EditError('원본 LOT를 찾지 못했습니다.');
 const l=hit.record,batch=(state.receiptBatches||[]).find(x=>x.id===info.batchId),entry=batch?.entries?.find(x=>x.id===info.entryId);
 const vendor=$('v33Vendor').value.trim(),brand=$('v33Brand').value.trim(),origin=$('v33Origin').value.trim(),received=$('v33Received').value,expiry=$('v33Expiry').value,qty=Number($('v33Qty').value),price=Number($('v33Price').value),note=$('v33Note').value.trim();
 const food=info.kind==='meat'||(l.category||'')!=='supplies';
 if(!info.isOwn&&!vendor)return v33EditError('입고 업체를 입력해 주세요.');
 if(info.kind==='meat'&&!origin)return v33EditError('원료육 원산지를 입력해 주세요.');
 if(info.kind==='meat'&&!/^(국내산?|대한민국|한국|한국산|korea|south korea)$/i.test(origin)&&!brand)return v33EditError('수입 원료육은 브랜드를 입력해야 합니다.');
 if(food&&!expiry)return v33EditError('식품류는 소비기한을 입력해야 합니다.');
 if(received&&expiry&&expiry<received)return v33EditError('소비기한이 입고일 또는 제조일보다 빠릅니다.');
 if(!Number.isFinite(price)||price<0)return v33EditError('단가를 확인해 주세요.');
 if(!Number.isFinite(qty)||qty<=0)return v33EditError('수량은 0보다 커야 합니다.');
 if(entry&&Math.abs(qty-info.initialQty)>0.00001){
  const otherTx=(state.transactions||[]).some(t=>t.lotId===l.id&&t.type!=='receive'&&t.type!=='receiveExtra'&&!t.undone);
  if(otherTx)return v33EditError('이 LOT는 출고·이동 이력이 있어 입고수량을 직접 변경할 수 없습니다. 다른 정보만 수정할 수 있습니다.');
  if(info.kind==='meat'&&Number(l.frozen)+Number(l.chilled)+(qty-info.initialQty)<-0.00001)return v33EditError('남은 재고보다 더 많이 차감할 수 없습니다.');
 }
 const before={vendor:l.vendor,brand:l.brand,origin:l.origin,expiry:l.expiry,received:l.received,price:l.price,qty:info.initialQty};
 const snap=structuredClone(state);
 try{
  l.vendor=info.isOwn?'':vendor;l.brand=brand;l.origin=origin;l.expiry=expiry;l.price=price;l.note=note;
  if(info.isOwn){l.manufactured=received;if(entry)entry.manufactured=received;}
  else l.received=received;
  if(entry){entry.vendor=l.vendor;entry.brand=brand;entry.origin=origin;entry.expiry=expiry;entry.received=received;entry.price=price;entry.qty=qty;}
  if(entry&&Math.abs(qty-info.initialQty)>0.00001){
   const diff=qty-info.initialQty;
   if(info.kind==='meat'){
    const init=(state.transactions||[]).find(t=>t.type==='receive'&&t.lotId===l.id);
    const zone=init?.effects?.[0]?.zone||(l.frozen>0?'frozen':'chilled');
    l[zone]=Math.round((Number(l[zone]||0)+diff)*1000)/1000;
    if(init){init.qty=qty;if(init.effects?.[0])init.effects[0].delta=qty;}
   }else{
    const oldQty=Number(l.qty)||0;l.qty=qty;
    if(l.unit==='kg')l.kg=qty;
    else{l.packs=qty;if(l.unit==='박스')l.boxes=qty;if(oldQty>0&&Number.isFinite(Number(l.kg)))l.kg=Math.round(Number(l.kg)*qty/oldQty*1000)/1000;}
    const tx=(state.transactions||[]).find(t=>t.type==='receiveExtra'&&t.lotId===l.id);if(tx)tx.qty=qty;
   }
  }
  if(batch&&!info.isOwn){
   // The incoming paper statement belongs to one supplier. Keep the linked LOTs and header consistent.
   batch.vendor=vendor;
   const match=V17_PARTNERS.find(p=>v17Compact(v17Label(p))===v17Compact(vendor)||v17Compact(p.n)===v17Compact(vendor));
   batch.partner=match||null;
   for(const e of batch.entries||[]){if(e.category==='finished_own')continue; e.vendor=vendor;const ref=v33Locate(e.id)?.record;if(ref)ref.vendor=vendor;}
  }
  state.corrections=state.corrections||[];
  state.corrections.unshift({at:new Date().toISOString(),lotId:l.id,batchId:batch?.id||'',before,after:{vendor:l.vendor,brand:l.brand,origin:l.origin,expiry:l.expiry,received:l.received,price:l.price,qty},kind:'입고 기록 수정'});
  if(!persist())throw Error('브라우저 저장에 실패했습니다.');
 }catch(e){state=snap;return v33EditError('수정 실패: '+e.message);}
 $('v33EditDialog').close();
 toast('입고 LOT와 연결된 명세서 내용을 수정했습니다.');
 if(batch?.id)v17ShowSaved('in',batch.id);
 else if(view==='stock_overview'||['dashboard','frozen','chilled'].includes(view)||EXTRA_CATEGORIES[view])setView(view);
}

<script>
(function(){
 'use strict';
 /* 실제 자동완성 목록만 제어합니다. 단순 재고 검색/날짜 입력 등에는 영향을 주지 않습니다. */
 const rules = [
  {selector:'.intake-row .in-search', locate:el=>el.closest('.intake-row')?.querySelector('.in-suggest')},
  {selector:'.v18-line .v18-search', locate:el=>el.closest('.v18-line')?.querySelector('.v18-suggestions')},
  {selector:'#intakeVendor', locate:()=>document.getElementById('v17PartnerMatches')},
  {selector:'#v18PartnerInput', locate:()=>document.getElementById('v18PartnerMatches')},
  {selector:'#f_recipient', locate:()=>document.getElementById('v17OutPartnerMatches')},
  {selector:'#inventoryProductSearch', locate:()=>document.getElementById('productMatches')}
 ];
 let serial=0;
 function getPicker(input){
  const rule=rules.find(x=>input.matches(x.selector));
  if(!rule)return null;
  const box=rule.locate(input);
  return box?{input,box}:null;
 }
 function isOpen(box){
  return !box.classList.contains('hidden') && !box.hidden &&
         !!(box.getClientRects().length);
 }
 function items(box){
  return [...box.querySelectorAll('button:not([disabled])')].filter(b=>!b.hidden && b.getClientRects().length);
 }
 function clear(input,box){
  box?.querySelectorAll('.erp-key-active').forEach(el=>{
   el.classList.remove('erp-key-active');el.removeAttribute('aria-selected');
  });
  input.removeAttribute('aria-activedescendant');
 }
 function activate(input,box,options,index){
  clear(input,box);
  const chosen=options[index];if(!chosen)return;
  chosen.classList.add('erp-key-active');
  chosen.setAttribute('aria-selected','true');
  if(!chosen.id)chosen.id='erp-kopt-'+(++serial);
  input.setAttribute('aria-activedescendant',chosen.id);
  chosen.scrollIntoView({block:'nearest',inline:'nearest'});
 }
 document.addEventListener('focusin',e=>{
  if(!(e.target instanceof HTMLInputElement))return;
  const p=getPicker(e.target);if(!p)return;
  p.input.setAttribute('aria-autocomplete','list');
  if(!p.box.id)p.box.id='erp-klist-'+(++serial);
  p.input.setAttribute('aria-controls',p.box.id);
 },true);
 document.addEventListener('input',e=>{
  if(!(e.target instanceof HTMLInputElement))return;
  const p=getPicker(e.target);if(p)clear(p.input,p.box);
 },true);
 // 포착 단계에서 처리하므로 기존의 'Enter 시 첫 번째 선택' 코드와 중복 실행되지 않습니다.
 document.addEventListener('keydown',e=>{
  if(!(e.target instanceof HTMLInputElement)||e.isComposing||e.keyCode===229||e.altKey||e.ctrlKey||e.metaKey)return;
  if(!['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key))return;
  const p=getPicker(e.target);if(!p||!isOpen(p.box))return;
  if(e.key==='Enter'&&p.input.matches('.v18-search,.in-search')&&!p.input.value.trim())return;
  const options=items(p.box);
  if(e.key==='Escape'){
   e.preventDefault();e.stopImmediatePropagation();clear(p.input,p.box);
   p.box.classList.add('hidden');p.input.setAttribute('aria-expanded','false');return;
  }
  if(!options.length)return;
  const current=options.findIndex(b=>b.classList.contains('erp-key-active'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
   e.preventDefault();e.stopImmediatePropagation();
   const next=current===-1?(e.key==='ArrowDown'?0:options.length-1):
              (current+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;
   activate(p.input,p.box,options,next);return;
  }
  if(e.key==='Enter'){
   e.preventDefault();e.stopImmediatePropagation();
   const picked=options[current===-1?0:current];
   clear(p.input,p.box);picked.click();
   // v57: 업체 자동완성을 Enter로 확정했다면 다음 칸으로 이동합니다.
   if(p.input.matches('#intakeVendor,#v18PartnerInput'))window.__ERP_ENTER_NEXT__?.(p.input);
  }
 },true);
})();
</script>

<script id="v57-enter-navigation">
(() => {
  'use strict';
  /* 한 건을 여러 입력칸에 입력하는 입고/출고 화면에만 적용합니다.
     Enter는 저장을 실행하지 않으며, 비어 있더라도 다음 칸으로 건너뜁니다.
     누락/필수값 검사는 기존 입고등록·출고등록 시점 그대로 유지합니다. */
  const $ = sel => document.querySelector(sel);
  const visible = el => !!el && el.isConnected && !el.disabled && !el.readOnly &&
    el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const collect = (root, selectors) => selectors.flatMap(sel =>
    [...root.querySelectorAll(sel)].filter(visible));
  function sequence(root) {
    if (root.classList.contains('intake-panel')) {
      const fields = collect(root, ['#intakeDate','#intakeVendor','#intakeNote']);
      root.querySelectorAll('.intake-row').forEach(row => {
        fields.push(...collect(row,[
          '.in-search','.in-cat','.in-qty','.in-unit','.in-price','.in-expiry'
        ]));
        // 상세 영역이 열렸을 때만 해당 세부 입력칸을 순회합니다.
        if(row.querySelector('details.intake-detail')?.open){
          fields.push(...collect(row,['.intake-detail input:not(.quick-date-calendar):not([type="checkbox"]):not([type="hidden"]), .intake-detail select']));
        }
      });
      const add=$('#intakeAdd');if(visible(add))fields.push(add);
      return fields;
    }
    if (root.classList.contains('v18-root')) {
      const fields=collect(root,['#v18Date','#v123Kind','#v18PartnerInput','#v18Note']);
      root.querySelectorAll('.v18-line').forEach(row => {
        fields.push(...collect(row,['.v18-search']));
        row.querySelectorAll('.v35-lot-row').forEach(lot => {
          fields.push(...collect(lot,['.v18-qty','.v35-lot-price']));
        });
        fields.push(...collect(row,['.v18-row-note']));
      });
      const add=$('#v18AddLine');if(visible(add))fields.push(add);
      return fields;
    }
    return [];
  }
  function advance(source){
    const root=source.closest('.intake-panel,.v18-root');if(!root)return false;
    const fields=sequence(root),ix=fields.indexOf(source);
    if(ix<0 || ix===fields.length-1)return false;
    const next=fields[ix+1];
    next.focus({preventScroll:true});
    next.scrollIntoView({block:'nearest',inline:'nearest'});
    if(next instanceof HTMLInputElement && next.type!=='number' && next.value &&
       typeof next.select==='function')next.select();
    return true;
  }
  window.__ERP_ENTER_NEXT__=advance;
  document.addEventListener('keydown',e => {
    if(e.key!=='Enter'||e.repeat||e.isComposing||e.keyCode===229||e.shiftKey||e.ctrlKey||e.altKey||e.metaKey)return;
    const target=e.target;
    if(!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement))return;
    if(target.matches('input[type="checkbox"],input[type="radio"],input[type="button"],input[type="submit"],input[type="date"],input.quick-date-calendar'))return;
    if(!target.closest('.intake-panel,.v18-root'))return;
    // 자동완성 목록에서 Enter 선택 시 기존 핸들러가 선택과 후속 포커스를 처리합니다.
    if(e.defaultPrevented && !target.matches('input[data-quick-date]'))return;
    // 품목 자동완성 선택 시 입력창이 재생성되어 이미 다음 칸에 포커스가 있습니다.
    const active=document.activeElement;
    if(active!==target && active?.matches('input,select,textarea'))return;
    e.preventDefault();
    advance(target);
  });
})();
</script>

#mainView .v61-stock-header{padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;margin:0 0 12px!important;box-shadow:none!important}
#mainView .v61-stock-header-title{display:none!important}
#mainView .v61-tab-group{display:flex!important;flex-wrap:nowrap!important;overflow:auto!important;gap:5px!important;padding:4px!important;border:0!important;border-radius:11px!important;background:#e6e6eb!important;scrollbar-width:none}
#mainView .v61-tab-group::-webkit-scrollbar{display:none}
#mainView .v61-tab{flex:1 0 auto!important;min-height:34px!important;padding:6px 11px!important;border:0!important;border-radius:8px!important;font-size:12px!important;background:transparent!important;color:#45454b!important;font-weight:550!important;white-space:nowrap!important}
#mainView .v61-tab.active{background:#fff!important;color:var(--app-ink)!important;box-shadow:0 1px 4px #00000017!important;font-weight:700!important}
#mainView .v61-tab-group .v61-tab:focus-visible{outline:2px solid var(--app-accent)}
#mainView .inventory-panel,#mainView .history-panel{border-radius:15px!important;box-shadow:none!important;border-color:#e5e5ea!important}
#mainView .filters{padding:12px!important;gap:8px!important}
#mainView .filters .search-field input{background:#f0f0f5!important;border-color:transparent!important;border-radius:10px!important;padding:10px 12px!important;font-size:15px!important}
#mainView .filter-count{font-size:11px!important;color:var(--app-secondary)}
#mainView .reset-filters{min-height:34px!important;font-size:12px!important;border:0!important;background:transparent!important;color:var(--app-accent)!important;padding:4px 0!important}
#mainView .v129-card-table>thead>tr{padding:3px 12px 8px!important;gap:5px!important}
#mainView .v129-card-table>thead>tr>th{min-height:31px!important;background:#f5f5f7!important;border:0!important}
#mainView .v129-card-table>thead>tr>th button{min-height:27px!important}
#mainView .v129-card-table>tbody{padding:0 12px!important}
#mainView#mainView .v129-card-table>tbody>tr{border:0!important;border-bottom:1px solid var(--app-line)!important;border-radius:0!important;margin:0!important;padding:11px 0!important;gap:0 10px;box-shadow:none!important;background:#fff!important}
#mainView#mainView .v129-card-table>tbody>tr:last-child{border-bottom:0!important}
#mainView#mainView .v129-card-table>tbody>tr>td{font-size:13px!important;padding:3px 0!important;line-height:1.42!important}
#mainView .v129-card-table>tbody>tr>td[data-v129-label]::before{font-size:10.5px;color:var(--app-secondary);margin-bottom:2px}
#mainView .v129-card-table>tbody>tr>td.v129-primary{font-size:16px!important;letter-spacing:-.25px}
#mainView .v129-card-table>tbody>tr>td.v129-action{margin:4px 0 0!important;padding-top:6px!important;border:0!important}
#mainView .v129-card-table>tbody>tr>td.v129-action button{color:var(--app-accent)!important;background:#eef5ff!important;border:0!important;border-radius:8px!important;min-height:37px!important;font-weight:650!important}
#mainView .v130-summary-table>tbody>tr.v130-summary-row{grid-template-columns:minmax(0,1fr) auto 32px!important;align-items:center;column-gap:8px!important;min-height:64px;padding:10px 0!important}
#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-name{grid-column:1!important;grid-row:1!important;font-size:15px!important;font-weight:650!important;align-self:end}
#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-name::before,#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-total::before,#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-category::before{display:none}
#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-total{grid-column:2!important;grid-row:1/3!important;align-self:center;text-align:right!important;font-size:16px!important;font-weight:700!important;white-space:normal!important;max-width:120px!important}
#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-category{grid-column:1!important;grid-row:2!important;font-size:11px!important;color:var(--app-secondary)!important;align-self:start}
#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-extra{grid-column:1/-1!important;display:none!important}
#mainView .v130-summary-table>tbody>tr.v130-summary-row.v130-expanded>td.v130-extra{display:block!important;border-top:1px solid #f0f0f3!important;margin-top:4px;padding-top:6px!important}
#mainView .v130-summary-table>tbody>tr.v130-summary-row>td.v130-toggle{grid-column:3!important;grid-row:1/3!important;align-self:center;padding:0!important}
#mainView .v130-toggle button{display:flex;align-items:center;justify-content:center;width:32px;height:44px;min-height:44px;padding:0;border:0;background:transparent;color:#9a9aa0;border-radius:8px}
#mainView .v130-toggle button svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;transition:transform .15s}
#mainView .v130-expanded .v130-toggle button svg{transform:rotate(90deg)}
#mainView .v74frozen .v72split aside{max-height:none!important;border:0!important;background:transparent!important}
#mainView .v74frozen .v72split aside .v75listhead,#mainView .v74frozen .v72split aside .v72pick{display:none!important}
#mainView .v130-product-select{display:block;padding:0 3px}
#mainView .v130-product-select span{display:block;margin-bottom:5px;color:var(--app-secondary);font-size:12px;font-weight:600}
#mainView .v130-product-select select{width:100%;min-height:46px!important;background:#f2f2f7;border:1px solid #dedee4;color:var(--app-ink);font-weight:600;padding:9px}
#mainView .v74frozen .v75detailhead h3{font-size:18px!important;letter-spacing:-.25px}
#mainView .v74frozen .v75metrics{background:#f2f2f7!important;border-radius:12px!important;padding:8px!important}
#mainView .v74frozen .v75metrics strong{font-size:19px!important;font-weight:750!important}
#mainView .v97-transaction{background:transparent!important;border:0!important;box-shadow:none!important}
#mainView .v97-transaction>.v97-common{background:#fff!important;border:1px solid #e5e5ea!important;border-radius:15px!important;gap:12px!important;padding:14px!important}
#mainView .v97-common>label{color:#55555c!important;font-size:12px!important;font-weight:650}
#mainView .v97-common input,#mainView .v97-common select:not(.quick-date-calendar){background:#f5f5f8!important;border:1px solid #e2e2e8!important}
#mainView .v97-list{margin:12px 0 0!important}
#mainView .v50-in-row,#mainView .v50-out-row{border-radius:14px!important;margin-bottom:12px!important;border-color:#e5e5ea!important}
#mainView .v50-in-row .intake-row-title{background:#f7f7fa!important;border-radius:14px 14px 0 0;font-size:13px!important;color:#3a3a40!important}
#mainView .v97-add{padding:6px 0 12px!important}
#mainView .v97-add button{border:0!important;border-radius:10px!important;background:#fff!important;color:var(--app-accent)!important;font-weight:650!important;min-height:44px!important}
#mainView .v97-footer{border-radius:14px!important;border:1px solid #e5e5ea!important;background:#fff!important;padding:12px!important}
#mainView .v97-commands{display:grid!important;grid-template-columns:1fr 1.5fr!important;gap:8px!important}
#mainView .v97-commands button{width:100%!important;border-radius:10px!important;min-height:44px!important}
#mainView .v97-commands .intake-save{grid-column:1/-1;min-height:48px!important;font-size:16px!important;background:var(--app-accent)!important;color:#fff!important}
#mainView .v97-note{color:var(--app-secondary);font-size:11px!important}
#mainView .v35-lot-row{border-radius:9px!important;background:#fff!important;margin:5px 0!important;padding:10px!important}
#mainView .v35-lot-row.v25-lot-picked{background:#eff6ff!important;border-color:#b4d6ff!important}
#mainView .v36-summary-actions button{min-height:44px!important;border-radius:9px!important}
.toast{bottom:calc(var(--app-tab-h) + 20px + env(safe-area-inset-bottom))!important}
}
@media screen and (max-width:360px){#v130Tabs{left:5px;right:5px}#v130Tabs button{font-size:10px}#v130Tabs button svg{width:23px;height:23px}.main-content{padding-left:10px!important;padding-right:10px!important}}
@media print{#v130Tabs,#v130StockShortcuts,#v130MoreHead{display:none!important}}
</style><script id="v130-native-mobile-js">
(()=>{'use strict';
const mq=matchMedia('(max-width:767px), (max-width:1023px) and (pointer:coarse)');
const root=document.getElementById('mainView'),sidebar=document.getElementById('sidebar'),shade=document.getElementById('v129NavShade'),toggle=document.getElementById('menuToggle');
if(!root||!sidebar||!shade||!toggle)return;
const svg=paths=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+paths+'</svg>';
const icons={stock:svg('<path d="M3 8.2 12 3l9 5.2v9.6L12 23l-9-5.2z"/><path d="m3 8.2 9 5.2 9-5.2M12 13.4V23M7.5 5.6l9 5.2"/>'),intake:svg('<path d="M4 15v5h16v-5M12 3v12m-5-5 5 5 5-5"/>'),ship:svg('<path d="M4 15v5h16v-5M12 15V3M7 8l5-5 5 5"/>'),operations:svg('<path d="M3 7h17m-5-5 5 5-5 5M21 17H4m5-5-5 5 5 5"/>'),more:svg('<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>')};
const tabs=[['stock','재고','stock_overview'],['intake','입고','intake'],['ship','출고','ship'],['operations','이동','operations'],['more','더보기','']];
const bar=document.createElement('nav');bar.id='v130Tabs';bar.setAttribute('aria-label','주 메뉴');bar.innerHTML=tabs.map(([id,label])=>'<button type="button" data-v130-tab="'+id+'">'+icons[id]+'<span>'+label+'</span></button>').join('');document.body.append(bar);
const moreHead=document.createElement('div');moreHead.id='v130MoreHead';moreHead.innerHTML='<strong>더보기</strong><button type="button" aria-label="더보기 닫기">×</button>';sidebar.prepend(moreHead);
const shortcuts=document.createElement('div');shortcuts.id='v130StockShortcuts';shortcuts.setAttribute('role','group');shortcuts.setAttribute('aria-label','재고 바로가기');shortcuts.innerHTML=[['stock_overview','전체'],['dashboard','원료육'],['frozen','냉동고'],['chilled','냉장고'],['finished_all','완제품'],['ingredients_all','부재료'],['supplies','부자재']].map(([v,n])=>'<button type="button" data-v130-view="'+v+'">'+n+'</button>').join('');root.before(shortcuts);
const stockViews=new Set(['stock_overview','dashboard','frozen','chilled','finished_all','finished_own','finished_buy','ingredients_all','sauce','spice','vegetable','supplies','pending','ingredient_other']);
let lastStock='stock_overview',lastView='',queued=false,openKeys=new Set();
const current=()=>sidebar.querySelector('[data-view].selected')?.dataset.view||'stock_overview';
function category(v){return stockViews.has(v)?'stock':['intake','ship','operations'].includes(v)?v:'more'}
function closeMore(){if(sidebar.classList.contains('open'))toggle.click();else if(!shade.hidden)shade.click();document.body.classList.remove('v130-menu-open');}
function go(v){closeMore();if(v!==current())sidebar.querySelector('[data-view="'+v+'"]')?.click();schedule();}
function updateNav(){
 const v=current(),cat=category(v),menu=sidebar.classList.contains('open');
 document.body.classList.toggle('v130-menu-open',mq.matches&&menu);
 for(const c of ['stock','intake','ship','operations','more'])document.body.classList.toggle('v130-'+c,mq.matches&&cat===c);
 if(stockViews.has(v))lastStock=v;
 for(const b of bar.querySelectorAll('button')){const on=b.dataset.v130Tab===(menu?'more':cat);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}
 shortcuts.style.display=mq.matches&&cat==='stock'?'flex':'none';
 for(const b of shortcuts.querySelectorAll('button')){if(b.dataset.v130View===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}
 if(v!==lastView){openKeys.clear();lastView=v;}
}
bar.addEventListener('click',e=>{const b=e.target.closest('[data-v130-tab]');if(!b||!mq.matches)return;const id=b.dataset.v130Tab;if(id==='more'){toggle.click();schedule();return;}go(id==='stock'?lastStock:tabs.find(t=>t[0]===id)[2]);});
moreHead.querySelector('button').onclick=()=>{closeMore();schedule();};
shortcuts.addEventListener('click',e=>{const b=e.target.closest('[data-v130-view]');if(b)go(b.dataset.v130View);});
shade.addEventListener('click',schedule);sidebar.addEventListener('click',schedule);
function decorateSummary(){
 const t=root.querySelector('.v61-all-table');if(!t)return;
 t.classList.add('v130-summary-table');
 for(const row of t.tBodies[0]?.rows||[]){
  if(row.cells.length!==6&&row.cells.length!==7)continue;
  if(row.cells[0].colSpan>1)continue;
  const cells=Array.from(row.cells);const key=[cells[0].textContent,cells[1].textContent,cells[2].textContent].join('|');
  row.classList.add('v130-summary-row');row.classList.toggle('v130-expanded',openKeys.has(key));
  cells[0].classList.add('v130-category');cells[1].classList.add('v130-name');cells[4].classList.add('v130-total');[2,3,5].forEach(i=>cells[i].classList.add('v130-extra'));
  if(cells.length===6){const c=row.insertCell();c.className='v130-toggle';c.innerHTML='<button type="button" aria-label="재고 상세 보기" aria-expanded="'+openKeys.has(key)+'">'+svg('<path d="m9 5 7 7-7 7"/>')+'</button>';const b=c.firstElementChild;b.onclick=e=>{e.stopPropagation();const on=!row.classList.contains('v130-expanded');row.classList.toggle('v130-expanded',on);on?openKeys.add(key):openKeys.delete(key);b.setAttribute('aria-expanded',String(on));};}
 }
}
function decorateProduct(){
 for(const aside of root.querySelectorAll('.v74frozen .v72split aside')){
  const choices=Array.from(aside.querySelectorAll('.v72pick'));if(!choices.length)continue;
  let field=aside.querySelector('.v130-product-select');
  if(!field){field=document.createElement('label');field.className='v130-product-select';field.innerHTML='<span>품목 선택</span><select aria-label="조회할 품목"></select>';const select=field.querySelector('select');choices.forEach(b=>{const opt=document.createElement('option');opt.value=b.dataset.v72Select;opt.textContent=b.textContent.trim().replace(/\s+/g,' ');select.append(opt);});select.onchange=()=>{aside.querySelector('[data-v72-select="'+CSS.escape(select.value)+'"]')?.click();};aside.prepend(field);}
  const select=field.querySelector('select'),selected=choices.find(b=>b.classList.contains('active'));if(selected)select.value=selected.dataset.v72Select;
 }
}
function cleanup(){root.querySelectorAll('.v130-toggle').forEach(n=>n.remove());root.querySelectorAll('.v130-product-select').forEach(n=>n.remove());root.querySelectorAll('.v130-summary-table').forEach(n=>n.classList.remove('v130-summary-table'));}
function update(){queued=false;updateNav();if(!mq.matches){cleanup();return;}decorateSummary();decorateProduct();}
function schedule(){if(!queued){queued=true;requestAnimationFrame(update)}}
new MutationObserver(records=>{if(records.some(r=>Array.from(r.addedNodes).concat(Array.from(r.removedNodes)).some(n=>n.nodeType===1&&!n.classList?.contains('v130-toggle')&&!n.classList?.contains('v130-product-select'))))schedule()}).observe(root,{subtree:true,childList:true});
new MutationObserver(schedule).observe(sidebar,{attributes:true,attributeFilter:['class']});
mq.addEventListener('change',schedule);window.addEventListener('resize',schedule);
const vv=window.visualViewport;if(vv)vv.addEventListener('resize',()=>{document.body.classList.toggle('v130-keyboard',mq.matches&&window.innerHeight-vv.height>160&&!!document.activeElement?.matches('input,textarea'));});
document.addEventListener('focusout',()=>document.body.classList.remove('v130-keyboard'));
schedule();
})();
</script></body></html>
