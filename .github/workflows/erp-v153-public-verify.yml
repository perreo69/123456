name: Verify public ChatGPT ERP v153
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/erp-v153-public-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'erp-qa-v153'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compare live ERP to browser-tested HTML
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request
          expected=pathlib.Path('erp/erp-app-v85.html').read_bytes()
          assert b'id="v153-flat-stock-list"' in expected
          digest=hashlib.sha256(expected).hexdigest()
          base='https://perreo69.github.io/123456/erp/'
          for attempt in range(12):
            try:
              with urllib.request.urlopen(base+'?verify='+str(time.time_ns()),timeout=10) as response:
                assert response.status==200
                assert b'erp-app-v85.html' in response.read()
              with urllib.request.urlopen(base+'erp-app-v85.html?verify='+str(time.time_ns()),timeout=10) as response:
                body=response.read()
                assert response.status==200
              actual=hashlib.sha256(body).hexdigest()
              if actual==digest:
                print('PUBLIC ERP v153: HTTP 200; exact tested HTML verified SHA256='+actual)
                break
              print('Deployment mismatch: '+actual,flush=True)
            except Exception as e:
              print(repr(e),flush=True)
            time.sleep(5)
          else:
            raise SystemExit('Public deployment not verified')
          PY
