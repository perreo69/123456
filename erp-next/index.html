function list(){const cols=cfg[page]||[];const date=cols.includes('날짜');return title(page==='재고현황'&&stockScope.category?'재고현황 · '+stockScope.category+(stockScope.warehouse?' · '+stockScope.warehouse:''):page,'등록 및 조회 · 독립 테스트 환경',!readOnly.has(page))+(page==='해동관리'?'<div class="thawactions"><button class="primary" data-thaw="해동">'+I('plus')+'해동등록</button><button data-thaw="생산 투입">생산 투입</button><button data-thaw="재냉동">재냉동</button><button data-thaw="냉장보관">냉장보관</button></div>'+thawSummary():page==='재고현황'&&isMeat(stockScope.category)?stockSummary():'')+'<section class="panel"><div class="toolbar"><div class="searchrow"><div class="searchbox">'+I('search')+'<input id="search" placeholder="검색어를 입력하세요" aria-label="통합검색" value="'+esc(query)+'"></div><button id="filterbtn" aria-expanded="false">'+I('filter')+'검색구분<span id="filtercount"></span></button><button class="primary searchsubmit" id="searchsubmit">'+I('search')+'<span>검색</span></button></div><button id="reset">'+I('reset')+'초기화</button><button id="csv">'+I('download')+'CSV</button></div>'+(date?'<div class="period"><b>기간</b><input type="date" id="from" aria-label="시작일" value="'+from+'"><span>~</span><input type="date" id="to" aria-label="종료일" value="'+to+'"><button data-period="today">오늘</button><button data-period="month">이번 달</button><button data-period="all">전체</button></div>':'')+'<div class="chips" id="chips"></div><div class="countrow">조회결과 <b id="resultcount"></b></div><div class="tablewrap listtable" id="listtable"></div><div class="footerbar"><button disabled>‹</button><button class="page">1</button><button disabled>›</button></div></section>'}
let catEdit={action:'',i:-1,j:-1};
function categoryPage(){return title(page,'대분류와 하위 분류를 등록하고 관리합니다.')+'<section class="panel"><div class="panelhead"><strong>품목 분류</strong><button class="primary" data-cat-action="add">'+I('plus')+' 대분류 추가</button></div><div class="categorylist">'+categories().map((c,i)=>'<section class="categorygroup"><div class="cathead"><strong>'+esc(c.name)+'</strong><span class="catcount">하위 '+c.subs.length+'개</span><div class="catactions"><button data-cat-action="rename" data-cat-index="'+i+'">수정</button><button data-cat-action="delete" data-cat-index="'+i+'">삭제</button></div></div><div class="catsubs">'+c.subs.map((sub,j)=>'<div class="catrow"><span>'+esc(sub)+'</span><div class="catactions"><button data-cat-action="renameSub" data-cat-index="'+i+'" data-sub-index="'+j+'">수정</button><button data-cat-action="deleteSub" data-cat-index="'+i+'" data-sub-index="'+j+'">삭제</button></div></div>').join('')+'<button class="catadd outline" data-cat-action="addSub" data-cat-index="'+i+'">'+I('plus')+' 하위 분류 추가</button></div></section>').join('')+'</div></section>'}
function categoryRecords(){return Object.entries(data).filter(([k,v])=>k!=='__categories'&&Array.isArray(v)).flatMap(([k,v])=>v).filter(r=>r&&typeof r==='object')}
function categoryAction(action,i,j){const c=categories()[i];if(action!=='add'&&!c)return;if(action==='delete'||action==='deleteSub'){const name=action==='delete'?c.name:c.subs[j];if(categoryRecords().some(r=>r['분류']===c.name&&(action==='delete'||r['하위분류']===name))){toast('사용 중인 분류는 삭제할 수 없습니다.');return}if(!confirm(name+' 분류를 삭제할까요?'))return;const a=ensureCategories();if(action==='delete')a.splice(i,1);else a[i].subs.splice(j,1);saveCategories();return}catEdit={action,i,j};$('categoryTitle').textContent=({add:'대분류 추가',rename:'대분류 수정',addSub:'하위 분류 추가',renameSub:'하위 분류 수정'})[action];$('categoryName').value=action==='rename'?c.name:action==='renameSub'?c.subs[j]:'';$('categoryEditor').showModal()}
function saveCategories(){const saved=persist();nav();render();toast(saved?'품목 분류 저장 완료 (이 기기에만 저장)':'브라우저 저장 실패 · 현재 화면에만 반영')}
$('categoryForm').addEventListener('submit',e=>{e.preventDefault();const name=$('categoryName').value.trim();if(!name){toast('분류명을 입력하세요.');return}const {action,i,j}=catEdit;const a=ensureCategories();const sub=action==='addSub'||action==='renameSub';const same=(x)=>x.toLowerCase()===name.toLowerCase();if(sub?a[i].subs.some((x,k)=>same(x)&&(action!=='renameSub'||k!==j)):a.some((x,k)=>same(x.name)&&(action!=='rename'||k!==i))){toast('이미 존재하는 분류명입니다.');return}if(action==='add')a.push({name,subs:[]});if(action==='addSub')a[i].subs.push(name);if(action==='rename'){const old=a[i].name;if(old==='원료육')a[i].warehouseViews=true;a[i].name=name;categoryRecords().forEach(r=>{if(r['분류']===old)r['분류']=name});if(stockScope.category===old)stockScope.category=name}if(action==='renameSub'){const old=a[i].subs[j];a[i].subs[j]=name;categoryRecords().forEach(r=>{if(r['분류']===a[i].name&&r['하위분류']===old)r['하위분류']=name})}$('categoryEditor').close();saveCategories()});
$('categoryClose').onclick=$('categoryCancel').onclick=()=>$('categoryEditor').close();
let thawAction='',thawLots=[];
function openThaw(action){thawAction=action;thawLots=inventory().filter(r=>action==='해동'?isMeat(r['분류'])&&r['보관상태']==='냉동':r['보관상태']==='해동');$('thawTitle').textContent=action==='해동'?'해동등록':action;$('thawDate').value=today();$('thawQty').value='';$('thawQty').removeAttribute('max');$('thawNote').value='';$('thawPlaceField').hidden=action!=='해동';$('thawPlace').value='냉장고';$('thawLot').innerHTML='<option value="">'+(thawLots.length?'재고를 선택하세요':'해당 재고가 없습니다')+'</option>'+thawLots.map((r,i)=>'<option value="'+i+'">'+esc([r['품목명'],r['업체명'],r['브랜드'],r['LOT'],fmt(r['중량(kg)'])].filter(Boolean).join(' · '))+'</option>').join('');$('thawBalance').textContent='';$('saveThaw').disabled=!thawLots.length;$('thawEditor').showModal()}
$('thawLot').addEventListener('change',()=>{const r=$('thawLot').value===''?null:thawLots[Number($('thawLot').value)];$('thawBalance').textContent=r?'사용 가능 '+fmt(r['중량(kg)']):'';if(r)$('thawQty').max=r['중량(kg)'];else $('thawQty').removeAttribute('max')});
$('thawForm').addEventListener('submit',e=>{e.preventDefault();const item=$('thawLot').value===''?null:thawLots[Number($('thawLot').value)],n=kg($('thawQty').value);if(!item||!n||n>item['중량(kg)']){toast('재고와 중량을 확인하세요.');return}if(thawAction==='재냉동'&&!confirm('식품안전 기준과 작업절차상 재냉동이 허용되는 경우에만 진행하세요. 확인하셨습니까?'))return;const p=thawAction==='생산 투입'?'출고입력':'이동입력';const r={...item,'날짜':$('thawDate').value,'구분':thawAction,'중량(kg)':n,'비고':$('thawNote').value};if(p==='이동입력'){r['출발상태']=item['보관상태'];r['출발창고']=item['창고'];r['도착상태']=thawAction==='해동'?'해동':thawAction==='재냉동'?'냉동':'냉장';r['도착창고']=thawAction==='해동'?$('thawPlace').value:placeFor(r['도착상태'])}if(!saveEvent(p,r)){toast('선택한 날짜의 재고가 부족합니다.');return}data['변경이력']=[...rows('변경이력'),{'날짜':today(),'메뉴':'해동관리','작업':thawAction,'비고':'브라우저 테스트'}];const saved=persist();$('thawEditor').close();render();toast(saved?'시험 자료 저장 완료 (이 기기에만 저장)':'메모리에만 저장됨: 브라우저 저장소 사용 불가')});
$('closeThaw').onclick=$('cancelThaw').onclick=()=>$('thawEditor').close();
function settings(){return title(page,'신규 ERP 시안 설정')+'<section class="panel" style="padding:20px"><h3>테스트 환경</h3><p>기존 운영 ERP, 계정 및 데이터베이스와 연결되어 있지 않습니다.</p><p>직접 입력한 시험 자료는 이 브라우저에만 저장됩니다. PC와 모바일 간 동기화는 하지 않습니다.</p><button id="clearLocal">시험 데이터 전체 삭제</button></section>'}
function render(){$('main').innerHTML=page==='대시보드'?dash():page==='환경설정'?settings():page==='품목분류관리'?categoryPage():list();if($('search')){$('search').addEventListener('input',e=>{query=e.target.value;refresh()});$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();refresh()}});['from','to'].forEach(id=>$(id)?.addEventListener('change',e=>{if(id==='from')from=e.target.value;else to=e.target.value;refresh()}));refresh()}}
function refresh(){if(!$('listtable'))return;const rr=filtered();$('resultcount').textContent='총 '+rr.length+'건';$('listtable').innerHTML=table(cfg[page]||[],rr,!readOnly.has(page));$('filtercount').textContent=conditions.length?' ('+conditions.length+')':'';$('chips').innerHTML=conditions.map((c,i)=>'<span class="chip">'+esc(c.field)+': '+esc(c.value)+'<button aria-label="조건 삭제" data-remove-chip="'+i+'">'+I('x')+'</button></span>').join('');$('chips').style.display=conditions.length?'flex':'none'}
function available(){return (cfg[page]||[]).filter(c=>c!=='날짜')}
function showFilter(){draft=conditions.map(c=>({...c}));$('filterpanel').hidden=false;$('filterscrim').hidden=false;$('filterbtn').setAttribute('aria-expanded','true');drawFilter();positionFilter()}
function positionFilter(){if($('filterpanel').hidden||!$('filterbtn'))return;const r=$('filterbtn').getBoundingClientRect();$('filterpanel').style.top=Math.min(r.bottom+8,Math.max(10,innerHeight-$('filterpanel').offsetHeight-10))+'px';$('filterpanel').style.left=Math.max(12,Math.min(r.left,innerWidth-$('filterpanel').offsetWidth-12))+'px'}
function closeFilter(){$('filterpanel').hidden=true;$('filterscrim').hidden=true;$('filterbtn')?.setAttribute('aria-expanded','false')}
function drawFilter(){const opts=available();$('filterpanel').innerHTML='<div class="filtertitle">검색 조건<button class="iconbtn" id="closefilter" aria-label="닫기">'+I('x')+'</button></div><div class="note">필요한 조건만 추가해서 사용하세요.</div><div id="conditionrows">'+draft.map((c,i)=>'<div class="condition"><select data-field="'+i+'" aria-label="검색항목">'+opts.map(o=>'<option '+(o===c.field?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select><input data-val="'+i+'" aria-label="검색값" placeholder="검색값 입력" value="'+esc(c.value)+'"><button class="iconbtn" data-remove="'+i+'" aria-label="조건 삭제">'+I('x')+'</button></div>').join('')+'</div><button class="addcondition" id="addcondition">'+I('plus')+' 조건 추가</button><div class="available">추가 가능한 조건 (직접 선택하여 추가)<div class="options">'+opts.map(o=>'<button data-addfield="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div><div class="filteractions"><button id="filterreset">초기화</button><button class="primary" id="applyfilter">검색</button></div>';positionFilter()}
function applyFilter(){conditions=draft.filter(c=>c.value.trim()).map(c=>({...c}));closeFilter();refresh()}
$('filterpanel').addEventListener('input',e=>{if(e.target.dataset.val!==undefined)draft[+e.target.dataset.val].value=e.target.value});$('filterpanel').addEventListener('change',e=>{if(e.target.dataset.field!==undefined)draft[+e.target.dataset.field].field=e.target.value});$('filterpanel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){e.preventDefault();applyFilter()}});
function addCondition(f){if(!available().length)return;draft.push({field:f||available().find(x=>!draft.some(c=>c.field===x))||available()[0],value:''});drawFilter();const input=$('filterpanel').querySelector('[data-val="'+(draft.length-1)+'"]');if(innerWidth>760)input?.focus()}
function openEditor(p,index=-1){if(readOnly.has(p))return;editPage=p;editIndex=index;const old=rows(p)[index]||{};const fields=(cfg[p]||[]).filter(c=>!(['입고입력','출고입력'].includes(p)&&c==='구분'));$('editTitle').textContent=p+' '+(index<0?'등록':'수정');$('fields').innerHTML=fields.map((f,i)=>{const val=old[f]??(f==='날짜'?today():'');const choices=f==='분류'?['',...new Set([...categories().map(c=>c.name),...(val?[val]:[])])]:f==='하위분류'?['',...new Set([...(categories().find(c=>c.name===old['분류'])?.subs||[]),...(val?[val]:[])])]:['보관상태','출발상태','도착상태'].includes(f)?['',...states]:f==='창고'||f.endsWith('창고')?['','냉동고','냉장고','실온','현장']:f==='구분'&&p==='이동입력'?['해동','재냉동','기타 이동']:null;return '<div class="field"><label for="f'+i+'">'+esc(f)+'</label>'+(choices?'<select id="f'+i+'" name="'+esc(f)+'">'+choices.map(o=>'<option '+(o===val?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':'<input id="f'+i+'" name="'+esc(f)+'" type="'+(f==='날짜'||f==='소비기한'?'date':'text')+'" '+(['품목명','업체명','브랜드','창고','권한명','완제품'].includes(f)&&fields.find(x=>['품목명','업체명','브랜드','창고','권한명','완제품'].includes(x))===f?'required':'')+' value="'+esc(val)+'">')+'</div>'}).join('');const mainCat=$('fields').querySelector('[name="분류"]');const subCat=$('fields').querySelector('[name="하위분류"]');if(mainCat&&subCat){mainCat.required=true;const sync=()=>{subCat.innerHTML=['',...(categories().find(c=>c.name===mainCat.value)?.subs||[])].map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');subCat.disabled=subCat.options.length===1};mainCat.addEventListener('change',sync);subCat.disabled=subCat.options.length===1} $('editor').showModal()}
$('editorform').addEventListener('submit',e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target));if(editPage==='입고입력')r['구분']='입고';if(editPage==='출고입력')r['구분']=editIndex>=0&&rows(editPage)[editIndex]['구분']==='생산 투입'?'생산 투입':'출고';if(['입고입력','출고입력','이동입력'].includes(editPage)){if(!kg(r['중량(kg)'])){toast('중량을 0보다 크게 입력하세요.');return}if(editPage==='이동입력'){if(r['구분']==='해동'){r['출발상태']='냉동';r['도착상태']='해동'}if(r['구분']==='재냉동'){r['출발상태']='해동';r['도착상태']='냉동';if(!confirm('식품안전 기준과 작업절차상 재냉동이 허용되는 경우에만 진행하세요. 확인하셨습니까?'))return}r['출발상태']||=stateFor(r['출발창고']);r['도착상태']||=stateFor(r['도착창고']);r['출발창고']||=placeFor(r['출발상태']);r['도착창고']||=placeFor(r['도착상태'])}else{r['보관상태']||=stateFor(r['창고']);r['창고']||=placeFor(r['보관상태'])}if(!saveEvent(editPage,r,editIndex)){toast('재고가 부족하거나 품목·LOT·업체·보관상태가 일치하지 않습니다.');return}}else{if(!data[editPage])data[editPage]=[];if(editIndex<0)data[editPage].push(r);else data[editPage][editIndex]=r;}data['변경이력']=[...rows('변경이력'),{'날짜':today(),'메뉴':editPage,'작업':editIndex<0?'등록':'수정','비고':'브라우저 테스트'}];const saved=persist();$('editor').close();if(page===editPage||page==='대시보드')render();else go(editPage);toast(saved?'시험 자료 저장 완료 (이 기기에만 저장)':'메모리에만 저장됨: 브라우저 저장소 사용 불가')});
function csv(){const cols=cfg[page]||[];const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const safe=s=>/^[=+@\-\t\r]/.test(String(s??''))?"'"+s:s;const b=new Blob(['\ufeff'+[cols.map(quote).join(','),...filtered().map(r=>cols.map(c=>quote(safe(r[c]))).join(','))].join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=page+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');const el=e.target.closest('[data-sort]');if(el&&page!=='대시보드'){const c=el.dataset.sort;sortDir=sortCol===c?-sortDir:1;sortCol=c;refresh();return}if(!b)return;const d=b.dataset;if(d.thaw){openThaw(d.thaw);return}if(d.stock!==undefined){go('재고현황',{category:d.stock,warehouse:d.warehouse||''});return}if(d.toggleStock){stockExpanded=!stockExpanded;nav();return}if(d.toggleMeat){meatExpanded=!meatExpanded;nav();return}if(d.catAction){categoryAction(d.catAction,Number(d.catIndex),Number(d.subIndex));return}if(d.page){go(d.page);return}if(d.group){if(d.group==='홈'){go('대시보드');return}openGroups.has(d.group)?openGroups.delete(d.group):openGroups.add(d.group);nav();return}if(d.new){openEditor(d.new);return}if(d.edit!==undefined){openEditor(page,+d.edit);return}if(d.addfield){addCondition(d.addfield);return}if(d.remove!==undefined){draft.splice(+d.remove,1);drawFilter();return}if(d.removeChip!==undefined){conditions.splice(+d.removeChip,1);refresh();return}if(d.period){const t=today();from=d.period==='today'?t:d.period==='month'?t.slice(0,7)+'-01':'';to=d.period==='all'?'':t;$('from').value=from;$('to').value=to;refresh();return}switch(b.id){case'hamb':$('sidebar').classList.toggle('shown');$('navscrim').hidden=!$('sidebar').classList.contains('shown');break;case'notice':toast('현재 신규 시안은 실시간 알림과 연결되어 있지 않습니다.');break;case'profile':go('환경설정');break;case'filterbtn':$('filterpanel').hidden?showFilter():closeFilter();break;case'closefilter':closeFilter();break;case'addcondition':addCondition();break;case'filterreset':draft=[];drawFilter();break;case'applyfilter':applyFilter();break;case'searchsubmit':$('search').blur();refresh();break;case'reset':query='';conditions=[];from='';to='';sortCol='';render();break;case'csv':csv();break;case'closeEditor':case'cancelEditor':$('editor').close();break;case'clearLocal':if(confirm('이 신규 시안에 입력한 시험 자료만 삭제할까요?')){data={};persist();toast('시험 데이터 삭제 완료');render()}break}});
$('navscrim').onclick=closeNav;$('filterscrim').onclick=closeFilter;window.addEventListener('resize',positionFilter);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeFilter();closeNav()}});$('hamb').innerHTML=I('menu');$('notice').innerHTML=I('bell');$('profile').innerHTML=I('user');nav();render();
</script></body></html>
