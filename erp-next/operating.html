<dialog id="rangeDialog" aria-labelledby="rangeHeading"><div class="dialoghead"><strong id="rangeHeading">기간설정</strong><button id="rangeClose" class="iconbtn" type="button" aria-label="닫기">×</button></div><div class="dialogbody" id="rangeBody"></div></dialog><dialog id="workEditor"><form id="workForm"><div class="dialoghead"><span id="workEditTitle">업무 등록</span><button type="button" class="iconbtn" id="workClose" aria-label="닫기">×</button></div><div class="dialogbody"><div class="formgrid"><div class="field" style="grid-column:1/-1"><label for="workName">제목</label><input id="workName" required maxlength="120"></div><div class="field"><label for="workKind">구분</label><select id="workKind"><option>일정</option><option>할 일</option></select></div><div class="field"><label for="workDate">날짜</label><input id="workDate" type="date" required></div><div class="field"><label for="workTime">시간 (선택)</label><input id="workTime" type="time"></div><div class="field"><label for="workRepeat">반복</label><select id="workRepeat"><option value="none">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select></div><div class="field"><label for="workLead">알림</label><select id="workLead"><option value="-1">없음</option><option value="0">정시</option><option value="10">10분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option><option value="1440">1일 전</option></select></div><div class="field"><label for="workScope">업무 구분</label><select id="workScope"><option>개인</option><option>공용 예정</option><option>배정 예정</option></select></div><div class="field"><label for="workAssignee">담당자 (메모용)</label><input id="workAssignee" maxlength="60"></div><div class="field"><label for="workLink">관련 ERP 화면</label><select id="workLink"></select></div><div class="field" style="grid-column:1/-1"><label for="workNote">메모</label><input id="workNote" maxlength="500"></div></div><p class="work-muted">공유·배정은 현재 개인 계정에만 기록됩니다. 다른 직원에게 전달되지 않습니 <script id="erp-popup-behavior-v1-script">
(()=>{
'use strict';
const root=document.documentElement;
const filter=document.getElementById('filterpanel');
const desktop=matchMedia('(min-width:761px) and (hover:hover) and (pointer:fine)');
const selector='dialog[open],#filterpanel:not([hidden])';
const interactive='button,input,select,textarea,a,label,[role=button],[contenteditable]';
const openBoxes=()=>Array.from(document.querySelectorAll(selector));
let drag=null,queued=false;
const moved=new Set();
function reset(box){
 if(!moved.has(box))return;
 moved.delete(box);delete box.dataset.erpDragged;
 box.style.removeProperty('left');box.style.removeProperty('top');
}
for(const box of document.querySelectorAll('dialog')){
 const body=box.querySelector('.dialogbody');
 const actions=body?.querySelector(':scope > .dialogactions');
 if(actions){body.classList.add('erp-split-body');actions.classList.add('erp-fixed-actions');body.after(actions);}
}
let outerViewport=null,frame=null;
try{if(parent!==window){outerViewport=parent.visualViewport;frame=window.frameElement;}}catch{}
function viewport(){
 const local=window.visualViewport;
 let top=local?.offsetTop||0, bottom=top+(local?.height||innerHeight);
 if(outerViewport&&frame){
  const rect=frame.getBoundingClientRect();
  top=Math.max(top,outerViewport.offsetTop-rect.top);
  bottom=Math.min(bottom,outerViewport.offsetTop+outerViewport.height-rect.top);
 }
 return {top:Math.max(0,top),bottom:Math.max(top+32,bottom)};
}
function updateViewport(){
 const v=viewport(),height=v.bottom-v.top;
 const keyboard=!desktop.matches&&height<innerHeight-80;
 root.classList.toggle('erp-popup-keyboard',keyboard);
 root.style.setProperty('--erp-popup-available',Math.max(32,height-16)+'px');
 root.style.setProperty('--erp-popup-top',(v.top+8)+'px');
 if(keyboard){
  const active=document.activeElement;
  const scroller=active?.closest('.dialogbody,.delivery-form-body,.filterpanel');
  if(scroller&&active.matches('input,textarea,select')){
   const a=active.getBoundingClientRect(),b=scroller.getBoundingClientRect();
   if(a.bottom>b.bottom-8)scroller.scrollTop+=a.bottom-b.bottom+8;
   else if(a.top<b.top+8)scroller.scrollTop-=b.top-a.top+8;
  }
 }
}
function clamp(n,min,max){return Math.max(min,Math.min(Math.max(min,max),n));}
function place(box,x,y){
 const r=box.getBoundingClientRect();
 box.style.left=clamp(x,8,root.clientWidth-r.width-8)+'px';
 box.style.top=clamp(y,8,innerHeight-r.height-8)+'px';
}
function sync(){
 queued=false;
 const boxes=openBoxes();

document.addEventListener('pointerdown',e=>{

desktop.addEventListener('change',resized);

outerViewport?.addEventListener('resize',schedule);
outerViewport?.addEventListener('scroll',schedule);
document.addEventListener('focusin',schedule);
sync();
})();
