<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>미르스타푸드 ERP</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Malgun Gothic",Arial,sans-serif;color:#222;background:#eee}button,input{font:inherit}button{cursor:pointer;border:1px solid #bcbcbc;background:#fff;color:#222;border-radius:4px;padding:9px 13px}button.primary{color:white;background:#303030;border-color:#303030}button:disabled{opacity:.5;cursor:wait}input{width:100%;padding:11px;border:1px solid #bbb;border-radius:4px;background:white;color:#222}label{display:block;font-size:13px;margin:12px 0 5px}h1{font-size:23px;margin:0 0 5px}h2{font-size:17px;margin:0 0 12px}p{font-size:13px;line-height:1.6;color:#555}.panel{width:min(400px,calc(100% - 32px));padding:30px;border:1px solid #ccc;border-radius:8px;background:white;box-shadow:0 4px 20px #0001}#gate{min-height:100%;display:grid;place-items:center}.full{width:100%;margin-top:14px}.msg{min-height:24px;font-size:13px;line-height:1.6;white-space:pre-wrap;color:#333}#shell{height:100dvh;display:flex;flex-direction:column}#bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#eee;border-bottom:1px solid #bbb;flex-wrap:wrap;font-size:12px}#bar button{padding:5px 10px;font-size:12px}#status{margin-right:auto;color:#555}iframe{width:100%;flex:1;border:none;min-height:0;background:#fff}dialog{width:min(460px,calc(100% - 24px));border:1px solid #aaa;border-radius:6px;padding:22px}dialog::backdrop{background:#0006}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}#inviteOutput{overflow-wrap:anywhere;font-family:monospace;padding:12px;background:#f3f3f3;border:1px solid #ccc;user-select:all} [hidden]{display:none!important}@media(max-width:600px){.panel{padding:22px}#bar{padding:5px 7px;gap:5px}#bar button{padding:5px 6px}#status{max-width:100%;flex:1 1 100%;order:2}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script></head><body>
<section id="gate"><div class="panel"><h1>미르스타푸드 ERP</h1><p>직원 전용 · 공동 재고 관리 · v85.4</p><form id="login"><label for="uid">아이디 또는 이메일</label><input id="uid" required autocomplete="username" maxlength="254" placeholder="아이디 또는 이메일"><label for="pw">비밀번호</label><input id="pw" type="password" required autocomplete="current-password"><div id="inviteField" hidden><label for="registerName">이름</label><input id="registerName" autocomplete="name" maxlength="50" placeholder="이름을 입력하세요"><label for="invite">초대 코드 (최초 계정 생성 시 1회)</label><input id="invite" autocomplete="off" maxlength="64"><label for="confirmPw">비밀번호 확인</label><input id="confirmPw" type="password" autocomplete="new-password"></div><button class="primary full" id="submit">로그인</button></form><button id="switchMode" class="full" type="button">직원 계정 생성</button><p id="message" class="msg" role="status"></p></div></section>
<section id="shell" hidden><header id="bar"><strong id="who"></strong><span id="status" aria-live="polite">연결 중</span><button id="refresh" title="최신 ERP 버전 및 서버 데이터 불러오기">새로고침</button><button id="newInvite" hidden>직원 초대</button><button id="changePw">내 정보</button><button id="logout">로그아웃</button></header><iframe id="app" title="미르스타푸드 ERP" referrerpolicy="no-referrer"></iframe></section>
<dialog id="passwordDialog"><form id="passwordForm"><h2>내 정보</h2><label for="accountName">이름</label><div style="display:flex;gap:6px"><input id="accountName" maxlength="50" autocomplete="name" placeholder="이름을 입력하세요"><button id="saveName" type="button" style="white-space:nowrap">이름 저장</button></div><p id="nameMessage" class="msg" role="status"></p><label for="accountId">아이디 또는 이메일</label><input id="accountId" readonly aria-readonly="true" style="background:#f1f1f1;color:#444"><p>아이디는 변경할 수 없습니다. 이름과 비밀번호는 변경할 수 있습니다.</p><label for="oldPw">현재 비밀번호</label><input id="oldPw" type="password" required autocomplete="current-password"><label for="newPw">새 비밀번호 (8자 이상)</label><input id="newPw" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><label for="newPw2">새 비밀번호 확인</label><input id="newPw2" type="password" required autocomplete="new-password"><p class="msg" id="passwordMessage"></p><div class="actions"><button type="button" id="cancelPw">취소</button><button class="primary" id="savePw">비밀번호 변경</button></div></form></dialog>
<dialog id="inviteDialog"><h2>직원 계정 생성용 초대 코드</h2><p>한 번만 사용 가능하며 48시간 후 만료됩니다. 해당 직원에게만 전달하세요.</p><div id="inviteOutput"></div><div class="actions"><button id="copyInvite">복사</button><button id="closeInvite">닫기</button></div></dialog>
<script>
'use strict';
const URL_BASE='https://waxjmsadrjqwjogfonyv.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndheGptc2Fkcmpxd2pvZ2Zvbnl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxODg3MjcsImV4cCI6MjExMDc2NDcyN30.OQkNANKHl5TrGYfuIuoHoHA71AtDoBggBvMbAloRL5I',APP='erp-app-v85.html',DOMAIN='@mirrstarfood-erp.example.com';
const $=id=>document.getElementById(id),gate=$('gate'),shell=$('shell'),frame=$('app'),status=$('status'),msg=$('message');
if(!window.supabase?.createClient){msg.textContent='인증 모듈을 불러오지 못했습니다. 인터넷 연결을 확인한 후 새로고침해 주세요. (AUTH-SDK)';}
const db=window.supabase?.createClient(URL_BASE,KEY,{auth:{storage:sessionStorage,storageKey:'mirrstar-erp-auth-v85',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let session=null,revision=0,lastJSON='',registration=false,channel=null,pollTimer=null,polling=false,blocked=false,loading=false,epoch=0;
window.erpSeed=null;window.erpInitialState=null;
function loginEmail(input){
 const u=input.trim().toLowerCase();
 if(/^[a-z0-9][a-z0-9._-]{2,31}$/.test(u))return u+DOMAIN;
 if(u.length<=254&&/^[a-z0-9.!#$%&'*+/=?^_\x60{|}~-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+$/.test(u)&&!u.endsWith(DOMAIN)&&!u.split("@")[0].startsWith(".")&&!u.split("@")[0].endsWith(".")&&!u.split("@")[0].includes(".."))return u;
 return null;
}
let staffName='',staffAdmin=false;
function updateWho(){const email=session?.user?.email||'';const id=email.endsWith(DOMAIN)?email.slice(0,-DOMAIN.length):email;$('who').textContent=(staffName||id)+(staffAdmin?' (관리자)':'');}
function notice(t){status.textContent=t;}
function mode(register){registration=register;$('inviteField').hidden=!register;$('registerName').required=register;$('invite').required=register;$('confirmPw').required=register;$('pw').autocomplete=register?'new-password':'current-password';$('pw').placeholder=register?'8자 이상':'';$('submit').textContent=register?'계정 생성':'로그인';$('switchMode').textContent=register?'로그인으로 돌아가기':'직원 계정 생성';msg.textContent='';}
$('switchMode').onclick=()=>mode(!registration);
async function closeERP(){epoch++;clearInterval(pollTimer);pollTimer=null;if(channel){const ch=channel;channel=null;db.removeChannel(ch);}frame.src='about:blank';window.erpSeed=null;window.erpInitialState=null;lastJSON='';blocked=false;session=null;shell.hidden=true;gate.hidden=false;}
db?.auth.onAuthStateChange((event,s)=>{session=s;if(event==='SIGNED_OUT')closeERP();});
async function openERP(){
 if(loading)return;loading=true;const ticket=++epoch;blocked=true;msg.textContent='계정 권한 및 데이터 확인 중...';
 try{
  const {data:{session:s}}=await db.auth.getSession();if(!s)throw Error('로그인해 주세요.');
  const {data:staff,error:staffErr}=await db.from('erp_staff').select('is_admin,display_name').eq('user_id',s.user.id).maybeSingle();if(staffErr||!staff)throw Error('승인된 직원 계정이 아닙니다.');
  const [seed,st]=await Promise.all([db.from('erp_company_seed').select('payload').eq('id',1).single(),db.from('erp_company_state').select('revision,body').eq('id',1).single()]);
  if(seed.error||st.error||!seed.data?.payload||!st.data)throw Error('공동 데이터 연결 실패');
  if(ticket!==epoch)return;session=s;window.erpSeed=seed.data.payload;window.erpInitialState=st.data.body;revision=Number(st.data.revision);lastJSON=st.data.body?JSON.stringify(st.data.body):'';blocked=false;
  staffName=staff.display_name||'';staffAdmin=staff.is_admin;updateWho();$('newInvite').hidden=!staff.is_admin;
  gate.hidden=true;shell.hidden=false;frame.style.pointerEvents='';frame.src=APP+'?v=85.3&t='+Date.now();notice('연결됨 · 서버 저장');
  if(!channel){channel=db.channel('mirrstar-erp-state-v85').on('postgres_changes',{event:'UPDATE',schema:'public',table:'erp_company_state',filter:'id=eq.1'},()=>{void sync();}).subscribe();}
  clearInterval(pollTimer);pollTimer=setInterval(()=>void sync(),4000);
 }catch(e){await closeERP();msg.textContent=e.message;await db.auth.signOut();}finally{loading=false;}
}
$('login').onsubmit=async e=>{
 e.preventDefault();const user=$('uid').value.trim().toLowerCase(),password=$('pw').value;
 const email=loginEmail(user);if(!email){msg.textContent='일반 아이디(영문·숫자 3~32자) 또는 올바른 이메일 주소를 입력하세요.';return;}
 $('submit').disabled=true;$('switchMode').disabled=true;msg.textContent='처리 중...';
 try{
  if(registration){if(!$('registerName').value.trim())throw Error('이름을 입력해 주세요.');if(password.length<8||new TextEncoder().encode(password).length>72||password!==$('confirmPw').value)throw Error('비밀번호는 8자 이상(최대 72바이트)이며 확인값과 일치해야 합니다.');
   const invite=$('invite').value.replace(/\s/g,'').toLowerCase();if(!/^[a-f0-9]{64}$/.test(invite))throw Error('초대 코드 64자리를 확인해 주세요. (INVITE-FORMAT)');
   let res;try{res=await fetch(URL_BASE+'/functions/v1/erp-register',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({username:user,password,invite,displayName:$('registerName').value.trim()})});}catch{throw Error('계정 생성 서버에 연결하지 못했습니다. (REGISTER-NETWORK)');}
   const out=await res.json().catch(()=>({}));if(!res.ok)throw Error((out.message||'계정 생성 요청 실패')+' (HTTP '+res.status+(out.code?' / '+out.code:'')+')');mode(false);$('invite').value='';$('confirmPw').value='';
   if(!db){msg.textContent='계정은 생성되었습니다. 인증 모듈 연결 실패로 새로고침 후 로그인해 주세요. (AUTH-SDK)';return;}
  }
  if(!db)throw Error('인증 모듈 연결 실패 (AUTH-SDK)');const result=await db.auth.signInWithPassword({email,password});if(result.error)throw Error('아이디 또는 비밀번호를 확인해 주세요.');session=result.data.session;$('pw').value='';await openERP();
 }catch(err){msg.textContent=err.message;}finally{$('pw').value='';$('submit').disabled=false;$('switchMode').disabled=false;}
};
window.erpSave=function(state){
 if(blocked||!session?.access_token){alert('저장할 수 없습니다. 먼저 서버 연결을 복구해 주세요.');return false;}
 const snapshot=JSON.stringify(state);if(snapshot===lastJSON)return true;
 try{
  const xhr=new XMLHttpRequest();xhr.open('PATCH',URL_BASE+'/rest/v1/erp_company_state?id=eq.1&revision=eq.'+revision+'&select=revision',false);
  xhr.setRequestHeader('apikey',KEY);xhr.setRequestHeader('Authorization','Bearer '+session.access_token);xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('Prefer','return=representation');
  xhr.send(JSON.stringify({revision:revision+1,body:state}));
  if(xhr.status!==200)throw Error('서버 응답 '+xhr.status);
  const data=JSON.parse(xhr.responseText);if(data.length!==1||Number(data[0].revision)!==revision+1)throw Error('다른 직원이 먼저 저장했습니다.');
  revision=Number(data[0].revision);lastJSON=snapshot;window.erpInitialState=JSON.parse(snapshot);notice('저장 완료 · '+new Date().toLocaleTimeString('ko-KR'));return true;
 }catch(err){blocked=true;frame.style.pointerEvents='none';notice('저장 확인 실패 · 새로고침 필요');alert('서버 저장을 확인하지 못했습니다. 다른 직원의 변경이나 연결 오류일 수 있습니다. 새로고침 후 실제 재고와 기록을 확인하세요. 중복 입력에 주의하세요.');return false;}
};
async function sync(){
 if(!session||loading||polling||blocked||shell.hidden)return;polling=true;const ticket=epoch;
 try{
  const {data:r,error}=await db.from('erp_company_state').select('revision').eq('id',1).single();
  if(error||!r)throw Error('서버 연결 확인 필요');if(ticket!==epoch||Number(r.revision)<=revision)return;
  const {data:full,error:e}=await db.from('erp_company_state').select('revision,body').eq('id',1).single();if(e||!full)throw Error('동기화 실패');if(ticket!==epoch||Number(full.revision)<=revision)return;
  if(frame.contentWindow?.erpApplyRemote?.(full.body)){revision=Number(full.revision);lastJSON=JSON.stringify(full.body);window.erpInitialState=full.body;notice('다른 직원의 변경사항 반영 완료');}
  else notice('다른 직원의 변경사항 있음 · 현재 입력을 마친 뒤 새로고침');
 }catch(e){notice('연결 확인 필요 · 저장 시 서버 검증');}finally{polling=false;}
}
$('refresh').onclick=()=>{
 if(!confirm('최신 ERP 버전과 서버 데이터를 다시 불러옵니다. 저장하지 않은 입력 내용은 사라질 수 있습니다. 계속할까요?'))return;
 $('refresh').disabled=true;notice('최신 버전 불러오는 중');
 const target=new URL('./',location.href);target.searchParams.set('refresh',String(Date.now()));location.replace(target.href);
};
if(new URL(location.href).searchParams.has('refresh'))history.replaceState(null,'',new URL('./',location.href).pathname);
$('logout').onclick=async()=>{if(confirm('로그아웃하시겠습니까?')){await closeERP();await db.auth.signOut();msg.textContent='로그아웃되었습니다.';}};
$('changePw').onclick=()=>{if(!session?.user)return;$('passwordForm').reset();const email=session.user.email||'';$('accountId').value=email.endsWith(DOMAIN)?email.slice(0,-DOMAIN.length):email;$('accountName').value=staffName;$('nameMessage').textContent='';$('passwordMessage').textContent='';$('passwordDialog').showModal();};
$('saveName').onclick=async()=>{if(!session?.user)return;const name=$('accountName').value.trim(),out=$('nameMessage');if(!name||name.length>50){out.textContent='이름을 1~50자로 입력하세요.';return;}$('saveName').disabled=true;try{const {data,error}=await db.from('erp_staff').update({display_name:name}).eq('user_id',session.user.id).select('display_name').single();if(error||!data)throw Error('이름 저장에 실패했습니다.');staffName=data.display_name;updateWho();out.textContent='이름을 저장했습니다.';}catch(e){out.textContent=e.message;}finally{$('saveName').disabled=false;}};
$('cancelPw').onclick=()=>$('passwordDialog').close();
$('passwordForm').onsubmit=async e=>{e.preventDefault();const n=$('newPw').value;const pmsg=$('passwordMessage');if(n!==$('newPw2').value||n.length<8||new TextEncoder().encode(n).length>72){pmsg.textContent='새 비밀번호와 확인값을 확인하세요.';return;}$('savePw').disabled=true;try{const old=await db.auth.signInWithPassword({email:session.user.email,password:$('oldPw').value});if(old.error)throw Error('현재 비밀번호가 일치하지 않습니다.');session=old.data.session;const changed=await db.auth.updateUser({password:n});if(changed.error)throw Error('비밀번호 변경 실패: '+changed.error.message);$('passwordDialog').close();alert('비밀번호를 변경했습니다.');}catch(err){pmsg.textContent=err.message;}finally{$('oldPw').value='';$('newPw').value='';$('newPw2').value='';$('savePw').disabled=false;}};
$('newInvite').onclick=async()=>{$('newInvite').disabled=true;try{const {data,error}=await db.rpc('erp_make_invite');if(error||!data)throw Error('직원 초대 코드 생성 실패');$('inviteOutput').textContent=data;$('inviteDialog').showModal();}catch(e){alert(e.message);}finally{$('newInvite').disabled=false;}};
$('copyInvite').onclick=async()=>{try{await navigator.clipboard.writeText($('inviteOutput').textContent);$('copyInvite').textContent='복사됨';}catch{alert('코드를 직접 선택해서 복사하세요.');}};
$('closeInvite').onclick=()=>{$('inviteDialog').close();$('inviteOutput').textContent='';$('copyInvite').textContent='복사';};
(async()=>{if(!db)return;const {data}=await db.auth.getSession();if(data.session){session=data.session;await openERP();}})();
</script></body></html>
